# XcodeGen spec for the ONE universal Apple target (iPhone, iPad, Mac, Apple TV).
# The agent creates the project with `xcodegen generate` (brew install xcodegen);
# nobody clicks through Xcode's New Project sheet. EarDrama.xcodeproj is generated
# output and gitignored: change the project HERE, then regenerate. A hand-edit in
# Xcode is silently wiped on the next generate.
#
# To adopt: rename `AppName` (name, target, PRODUCT_NAME, scheme) and set
# bundleIdPrefix + PRODUCT_BUNDLE_IDENTIFIER. No spaces in the name.
name: EarDrama
options:
  bundleIdPrefix: app
  createIntermediateGroups: true
  # Floors are chosen by the hardware they reach, and tools/test_ios_floor.py +
  # test_tvos_floor.py hold them in CI. iOS 18 keeps the iPhone XS / XR that
  # iOS 26 dropped; tvOS 26 keeps the Apple TV HD that tvOS 27 dropped.
  deploymentTarget:
    iOS: "18.0"
    tvOS: "26.0"
    macOS: "26.0"
    # watchOS 11 is the release an iPhone on iOS 18 (the iOS floor) pairs
    # with, and it runs on the same watches watchOS 26 does (Series 6 and
    # later, SE 2nd generation, every Ultra). See apple/README.md.
    watchOS: "11.0"
  groupSortPosition: top
# MARKETING_VERSION / CURRENT_PROJECT_VERSION come ONLY from this file
# (Decision 003). Never set them on the target; a target copy shadows it.
configFiles:
  Debug: AppVersion.xcconfig
  Release: AppVersion.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Approachable concurrency: code is MainActor-isolated by default, so
    # SwiftUI views and @Observable stores need no annotation. APIClient is an
    # actor and stays off the main actor on its own.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    # Left empty on purpose: never commit a team id to the template. Simulator
    # and CODE_SIGNING_ALLOWED=NO builds need none. For a device or archive
    # build, set your 10-char Team ID here in the adopting app, or pass
    # DEVELOPMENT_TEAM=XXXXXXXXXX to xcodebuild (tools/submit-appstore.sh
    # passes $ASC_TEAM_ID).
    DEVELOPMENT_TEAM: ""
targets:
  EarDrama:
    type: application
    # One target, four destinations (Decision 013, amended by 019). Per-platform
    # UI is guarded by #if os(iOS) / os(macOS) / os(tvOS) inside each file, so
    # every file compiles into every slice with no exclusion lists.
    supportedDestinations: [iOS, tvOS, macOS]
    sources:
      - path: apple
        excludes:
          - "Tests/**"
          - "UITests/**"
          # The Apple Watch app is its own target (EarDramaWatch, below).
          - "watchOS/**"
          # The folder READMEs are notes for people, not app resources.
          - "**/*.md"
          - "Resources/PrivacyInfo.xcprivacy"
          # Read by the build settings below, never bundled as resources.
          - "Resources/EarDrama-Info.plist"
          - "Resources/EarDrama.entitlements"
          - "Resources/EarDrama-tvOS.entitlements"
          # The Top Shelf extension is its own target (EarDramaTopShelf, below).
          - "TopShelf/**"
      # The privacy manifest (App Store requirement): named here so it is
      # always a bundle resource, never left to file-type inference.
      - path: apple/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The castable scripts plays phase 1 bundles (PLAYS-DESIGN §3), built by
      # catalog/tools/build_castable_scripts.py; Android bundles the same file.
      - path: catalog/plays/castable-scripts.json
        buildPhase: resources
        # The TV records nothing and keeps no plays in phase 1 (§6).
        destinationFilters: [iOS, macOS]
    dependencies:
      - target: EarDramaTopShelf
        destinationFilters: [tvOS]
        embed: true
    scheme:
      testTargets:
        - EarDramaTests
    # The Worker's address and the Google client id (placeholders until the
    # owner fills them; sign-in shows as not available until then).
    configFiles:
      Debug: Accounts.xcconfig
      Release: Accounts.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.eardrama
        PRODUCT_NAME: EarDrama
        # Xcode writes the Info.plist from INFOPLIST_KEY_* settings, so there
        # is no plist file to drift. CFBundleVersion and the short version are
        # filled from AppVersion.xcconfig automatically.
        GENERATE_INFOPLIST_FILE: YES
        # Only the Accounts.xcconfig keys; Xcode merges the generated keys in.
        INFOPLIST_FILE: apple/Resources/EarDrama-Info.plist
        # Sign in with Apple and Group Activities (SharePlay); both are enabled
        # on the app.eardrama App ID (2026-10-23), so the profiles carry them.
        # Associated Domains (applinks:eardrama.org, Universal Links) was
        # enabled on the App ID 2026-10-24; a profile without it fails the build.
        CODE_SIGN_ENTITLEMENTS: apple/Resources/EarDrama.entitlements
        # The Apple TV app adds the App Group it shares with the Top Shelf
        # extension; iOS and the Mac do not carry it.
        "CODE_SIGN_ENTITLEMENTS[sdk=appletv*]": apple/Resources/EarDrama-tvOS.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: "Ear Drama"
        # Standard HTTPS only: skips the export-compliance question on every
        # TestFlight / App Store build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Mac App Store listing category (Entertainment, Decision 067); ignored on iOS and tvOS.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # tvOS needs a LAYERED "App Icon & Top Shelf Image" brandassets set,
        # never the square iOS appiconset (see branding/README.md).
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvos*]": "App Icon & Top Shelf Image"
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletvsimulator*]": "App Icon & Top Shelf Image"
        # The Mac App Store requires the sandbox. Xcode derives these
        # entitlements from the settings and merges them with the file above,
        # which holds Sign in with Apple and SharePlay. Add only the scopes used.
        "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
        "ENABLE_OUTGOING_NETWORK_CONNECTIONS[sdk=macosx*]": YES
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        # Plays: the microphone records a performer's part (PLAYS-DESIGN §4).
        # Asked at the moment of recording, never at launch.
        "ENABLE_RESOURCE_ACCESS_AUDIO_INPUT[sdk=macosx*]": YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Ear Drama records your part in a play. The recording stays on this device."
        # Audio keeps playing with the screen locked or the app in the
        # background (research 04 §2.2). macOS needs no background mode.
        "INFOPLIST_KEY_UIBackgroundModes[sdk=iphone*]": audio
        "INFOPLIST_KEY_UIBackgroundModes[sdk=appletv*]": audio
        # The bundled seed catalog (contract §2). The database is NEVER
        # committed: the "Bundle catalog seed" phase copies this file into the
        # app at build time. Override on the command line, e.g.
        # xcodebuild ... CATALOG_SEED_PATH=/path/to/ear-drama.sqlite
        CATALOG_SEED_PATH: $(SRCROOT)/catalog/out/publish-clean/ear-drama.sqlite
    postCompileScripts:
      - name: Bundle catalog seed
        # Declared, so the build keeps its user-script sandbox: the phase may read
        # only the seed and write only the bundled copy.
        inputFiles:
          - $(CATALOG_SEED_PATH)
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ear-drama-seed.sqlite
        script: |
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ear-drama-seed.sqlite"
          if [ -f "${CATALOG_SEED_PATH}" ]; then
            mkdir -p "$(dirname "$DST")"
            cp -f "${CATALOG_SEED_PATH}" "$DST"
            echo "Bundled catalog seed: ${CATALOG_SEED_PATH}"
          else
            rm -f "$DST"
            echo "No catalog seed at ${CATALOG_SEED_PATH}; the app opens empty until the download lands."
          fi

  # The Apple TV Top Shelf (tvOS-DESIGN §9.2): the listener's Continue items,
  # read from the snapshot the app writes into the App Group. Only the snapshot
  # file is shared with the app; it has no catalog and no network.
  EarDramaTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: apple/TopShelf
        excludes:
          - "Info.plist"
          - "TopShelf.entitlements"
      - path: apple/Core/TopShelf/TopShelfSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.eardrama.TopShelf
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: apple/TopShelf/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Ear Drama Top Shelf"
        CODE_SIGN_ENTITLEMENTS: apple/TopShelf/TopShelf.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SKIP_INSTALL: YES

  # Core unit tests. NOT hosted in the app: hosting the universal app built the
  # app module twice ("Multiple commands produce EarDrama.swiftmodule") in
  # Tidbits Trivia. Compiling Core/ straight into the bundle avoids that, and
  # Core is the shared logic the universal target exists for. macOS-only, so
  # `xcodebuild test -destination platform=macOS` needs no simulator.
  EarDramaTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: apple/Tests
        excludes:
          # Read by RoomProtocolTests from the source tree, never bundled.
          - "Fixtures/**"
      - path: apple/Core
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.eardrama.CoreTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  # The Apple Watch stub (Decision 056): builds and launches, PARITY column
  # marked pending, grown out only after the core five. Core joins the watch
  # file by file, only where it compiles on watchOS, and nothing that fetches
  # the catalog (no CatalogRefreshService, no seed). Not yet embedded in the
  # phone app: that comes with the build-out, when it has something to show.
  EarDramaWatch:
    type: application
    platform: watchOS
    sources:
      - path: apple/watchOS
        excludes:
          - "**/*.md"
      # Design.swift is left out: UIColor(dynamicProvider:) does not exist on
      # watchOS, and the file is generated (tools/design_tokens.mjs).
      - path: apple/Core/Player/ListeningHistory.swift
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.eardrama.watchkitapp
        PRODUCT_NAME: EarDramaWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Ear Drama"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.eardrama
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  # The tap tier (docs/DEVICE-HARNESSES.md, iOS): XCUITest drives the real iPhone
  # through tools/ios_uitest.py, which holds the device lease. iOS only; its own
  # scheme below, so the macOS `EarDrama` test action and CI never build it.
  EarDramaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: apple/UITests
    dependencies:
      - target: EarDrama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.eardrama.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: EarDrama
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  EarDramaUITests:
    build:
      targets:
        EarDrama: all
        EarDramaUITests: [test]
    test:
      config: Debug
      targets: [EarDramaUITests]
