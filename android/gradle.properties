# Gradle JVM args — large heap accelerates Hilt + KSP code generation
# on the 17K-class-and-growing kind of project this template targets.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official
ksp.incremental=true

# The KOTLIN compile daemon is a SEPARATE JVM from Gradle's and takes its own
# heap — unbounded by default. A release build (R8 + Kotlin) on top of an
# already-busy dev Mac drove it to 18% free memory and millions of pageouts,
# which is what swapping feels like from the keyboard. Bound it.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# parallel=true with no cap spawns one worker per core; on a shared dev
# machine that is the difference between a build and a stall.
org.gradle.workers.max=4

# Compose
android.nonTransitiveRClass=true
android.nonFinalResIds=true

