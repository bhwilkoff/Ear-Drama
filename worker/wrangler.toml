# Ear Drama's Worker: optional accounts and sync (Decision 057), ported from
# Archive Watch's worker/ (one free Worker, D1, rate-limit bindings, a cron
# sweep). Nothing here is a secret. Secrets go in with `wrangler secret put`
# (docs/WORKER.md), and the placeholders below are replaced by the owner.
name = "eardrama-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Comma-separated `aud` values an identity token may carry. Apple: the bundle
# id (iOS, iPadOS, macOS, tvOS) and the Services ID (web, Android). Google:
# the OAuth client ids (web, iOS, and the web id Android asks for).
APPLE_AUDIENCES = "app.eardrama,app.eardrama.signin"
GOOGLE_AUDIENCES = "1083349339355-hmed22o33qemdc3dfhbqhkt0vho782ak.apps.googleusercontent.com,1083349339355-rlirbmc6c6c32h503vm120ig3kdopavp.apps.googleusercontent.com"
# Browsers that may call this Worker. Native apps send no Origin header.
# http://localhost and http://127.0.0.1 on any port are always allowed.
ALLOWED_ORIGINS = "https://eardrama.org,https://www.eardrama.org"
# Only needed to revoke Sign in with Apple tokens when an account is deleted.
# The private key itself is a secret (APPLE_PRIVATE_KEY).
APPLE_TEAM_ID = ""
APPLE_KEY_ID = ""

[[d1_databases]]
binding = "DB"
database_name = "eardrama"
database_id = "ce7adf80-6059-41c3-b20a-8df2b5457569"
migrations_dir = "migrations"

# Hourly sweep: expired sessions, idle rooms, and quiet room members are
# deleted, not just ignored (Archive Watch's rooms sweep hourly too). Every
# five minutes the archive.org uploader runs (plays-archive.js ARCHIVE_CRON),
# and does nothing until IA_S3_ACCESS_KEY and IA_S3_SECRET_KEY are both set.
[triggers]
crons = ["23 * * * *", "*/5 * * * *"]

# Rate limits (Archive Watch together.js `limited()`): counted per key for the
# window only, nothing stored. EVERY_IP is the floor on every route; AUTH
# counts sign-in and refresh per address; USER counts a signed-in person, so a
# classroom behind one school address is not one person.
[[ratelimits]]
name = "EVERY_IP_LIMITER"
namespace_id = "8301"
  [ratelimits.simple]
  limit = 600
  period = 60

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "8302"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "USER_LIMITER"
namespace_id = "8303"
  [ratelimits.simple]
  limit = 120
  period = 60

# Listen Together rooms (rooms.js; Archive Watch together.js). ROOM counts
# every room call per address (a member polls about 30 times a minute, so 300
# is a household). CREATE and JOIN are per address; JOIN is the floor under
# code guessing. MEMBER counts one member key, so one device cannot use up a
# household's share.
[[ratelimits]]
name = "ROOM_LIMITER"
namespace_id = "8304"
  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "ROOM_CREATE_LIMITER"
namespace_id = "8305"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "ROOM_JOIN_LIMITER"
namespace_id = "8306"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "ROOM_MEMBER_LIMITER"
namespace_id = "8307"
  [ratelimits.simple]
  limit = 60
  period = 60

# Shared plays (M8, plays.js). UPLOAD counts one person's take uploads; JOIN
# counts one person's invite views and claims and class joins.
[[ratelimits]]
name = "PLAY_UPLOAD_LIMITER"
namespace_id = "8308"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "PLAY_JOIN_LIMITER"
namespace_id = "8309"
  [ratelimits.simple]
  limit = 20
  period = 60

# Plays that need no account (plays-open.js), counted per address: READ is an
# open invite's view and the finished listing; AUDIO is the take files a
# listener fetches in a run (a play has hundreds of lines).
[[ratelimits]]
name = "OPEN_READ_LIMITER"
namespace_id = "8310"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "OPEN_AUDIO_LIMITER"
namespace_id = "8311"
  [ratelimits.simple]
  limit = 300
  period = 60

# PLACEHOLDER, owner: take audio for shared plays (plays.js). R2 asks for a
# payment method on file even on its free tier (research 08c Q8), so the
# binding stays commented out until the owner decides; without it, take
# uploads answer 503 storage_not_configured. To turn it on, create the bucket
# (npx wrangler r2 bucket create eardrama-takes) and uncomment these lines.
# The tests bind a local stand-in (vitest.config.js).
# [[r2_buckets]]
# binding = "TAKES"
# bucket_name = "eardrama-takes"
