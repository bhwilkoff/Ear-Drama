<div id="app"></div>
<script>
const q = new URLSearchParams(location.search), s = q.get('s') || 'record', wide = q.get('wide') === '1';
if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; else document.documentElement.dataset.theme = 'light';
if (wide) document.body.classList.add('wide');
const P = {home:'M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z',browse:'M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z',mic:'M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1a7 7 0 0 0 6-6.9z',search:'M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z',lib:'M4 4h3v16H4zm5 0h3v16H9zm5.2.6 2.9-.8 4.2 15.5-2.9.8z',plus:'M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z',x:'M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z',back:'M11 5 4 12l7 7 1.4-1.4L7.8 13H20v-2H7.8l4.6-4.6z',undo:'M8 5 3 10l5 5v-3.5h6a3.5 3.5 0 0 1 0 7H9v2h5a5.5 5.5 0 0 0 0-11H8z',pause:'M7 5h4v14H7zm6 0h4v14h-4z',play:'M8 5v14l11-7z',b5:'M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z',file:'M6 2h8l4 4v16H6zm7 1.5V7h3.5z',clip:'M9 2h6v3h4v17H5V5h4zm2 2v2h2V4z',book:'M4 4h7v15H4zm9 0h7v15h-7z',wave:'M7 9h2v6H7zm4-3h2v12h-2zm4 3h2v6h-2z',spk:'M4 9v6h4l5 4V5L8 9zm12.5 3a4 4 0 0 0-2-3.5v7a4 4 0 0 0 2-3.5z',more:'M5 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z',queue:'M3 6h13v2H3zm0 5h13v2H3zm0 5h8v2H3zm13-2v6l5-3z',share:'M12 2 7 7l1.4 1.4L11 5.8V15h2V5.8l2.6 2.6L17 7zM5 12v9h14v-9h-2v7H7v-7z'};
const ic = (n) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const nav = [['home','Home'],['browse','Browse'],['mic','Record'],['search','Search'],['lib','Library']];
const side = (on) => `<nav class="side"><p>Ear Drama</p>${nav.map(([i,l]) => `<a class="${l===on?'on':''}">${ic(i)}${l}</a>`).join('')}</nav>`;

/* ---- the play as pasted ---- */
const paste = `The Landing of the Pilgrims

ANNOUNCER. It is early in the year 1620, and John Robinson, who is the pastor and leader of the Pilgrims, is talking to John Carver.

ROBINSON. No word yet from Elder Brewster?

CARVER. Nay, not a word. I fear me that he and Master Cushman have found it impossible to raise such a large sum of money.

ROBINSON. If we delay much longer King James may repent himself of his generosity.

CARVER. I'll not lose faith, Pastor Robinson. I know a way will be found for us. [knock]

ROBINSON. Will you see who's at the door?

CARVER. Of course, Pastor. [sound of opening door]

Good day to you, sir.

KIEFT. Does Master John Robinson dwell here?`;
const lines = [
 ['mystery','ROBINSON','Will you see who&rsquo;s at the door?'],
 ['scifi','CARVER','Of course, Pastor.<br><span class="sfx">'+ic('spk').replace('class="ic"','class="ic" style="width:14px;height:14px"')+'sound of opening door</span>'],
 ['open','','Good day to you, sir.'],
 ['western','KIEFT','Does Master John Robinson dwell here?'],
 ['scifi','CARVER','Aye. Will you enter?'],
 ['western','KIEFT','Thank you.'],
 ['scifi','CARVER','Pastor Robinson, this gentleman would speak with you.'],
 ['mystery','ROBINSON','Good morrow to you, sir.'],
 ['western','KIEFT','Are you Pastor Robinson, then?'],
 ['mystery','ROBINSON','I am. And to what do I owe the honor of this visit, Master&mdash;ah&mdash;?'],
 ['western','KIEFT','My name is Kieft, Wilhelm Kieft, at your service.'],
 ['mystery','ROBINSON','I am honored, Master Kieft. Allow me to present Master Carver. <em>(they greet each other)</em>'],
 ['western','KIEFT','And now to the business that brought me here&mdash;it is rumored about Leyden that you and your company are about to leave Leyden. Is that true?'],
];
const script = (n, L = lines) => L.slice(0, n).map(([h,nm,t]) => h === 'open'
 ? `<div class="open"><span class="lab">No part</span><div>${t}</div><div class="chips">${chip('scifi','CARVER')}${chip('western','KIEFT')}<span class="chip q">Direction</span><span class="chip q">More</span></div></div>`
 : `<div class="ln" data-hue="${h}"><div class="nm">${nm}</div><div>${t}</div></div>`).join('');

const V = {};
V.record = () => page('Record', `<div class="head"><h1 class="h1">Record</h1><button class="btn g">${ic('plus')}Add a script</button></div>
 <h2 class="h2">Yours</h2>${row('A','The Albany Depot','18 of 166 lines recorded')}
 <section class="sec"><h2 class="h2">Your scripts</h2>${row('T','The Landing of the Pilgrims','9 parts · 297 lines')}${row('M','Marston to Attack Earth','4 parts · 37 of 149 lines cast')}</section>
 <section class="sec"><h2 class="h2">Plays</h2><div class="play3">${[['ROBINSON','No word yet from Elder Brewster?','CARVER','Nay, not a word.','The Landing of the Pilgrims','9 voices · About 26 min'],['POLLY','Father and I went down to camp,','BIJAH','Phew! pooh&mdash;ah, choh!','After Taps','11 voices · About 64 min']].concat(wide?[['HERALD','Move on up, move on, move on.','AMPHITHEUS','Has anyone spoken yet?','The Acharnians','13 voices · About 79 min']]:[]).map(([a,b,c,d,e,f]) => `<div class="pt"><div class="pg"><b>${a}</b><br>${b}<br><b>${c}</b><br>${d}</div><div class="nn">${e}</div><div class="c">${f}</div></div>`).join('')}</div></section>`);

V.add = () => full(side('Record') + `<div class="screen"><div class="bar"><button class="ib">${ic('x')}</button><div class="tt b">Add a script</div><button class="btn p sm">Next</button></div>
 <div class="body"><label class="f"><span class="c">Title</span><input class="field" value="The Landing of the Pilgrims"></label>
 <div class="head"><span class="c">Script</span><span><button class="btn g sm">${ic('clip')}Paste</button><button class="btn g sm">${ic('file')}Open a file</button></span></div>
 <div class="field paste">${paste}</div>
</div><div class="foot" style="text-align:center"><span class="c"><span class="t">9 parts · 297 lines</span> · Kept on this device</span></div></div>`);

const joined = lines.filter(l => l[0] !== 'open').map(l => l[1] === 'CARVER' && l[2].startsWith('Of course') ? [l[0], l[1], l[2] + '<div>Good day to you, sir.</div>'] : l);
const partsScreen = (sheet) => full(side('Record') + `<div class="screen"><div class="bar"><button class="ib">${ic('back')}</button><div class="tt"><div class="b">The Landing of the Pilgrims</div><div class="c t">9 parts · 297 lines</div></div><button class="ib">${ic('undo')}</button><button class="btn p sm">Done</button></div>
 <div class="note"><span class="w">${sheet ? '1 line has no part' : '2 lines have no part'}</span><button class="btn g sm">Next</button></div>
 <div class="body">${wide ? '' : ''}<div class="chips" style="margin-bottom:18px">${chip('serial','JONES','71')}${chip('scifi','CARVER','67')}${chip('western','KIEFT','55')}${chip('mystery','ROBINSON','44')}<span class="chip q">5 more</span><span class="chip q">${ic('plus').replace('class="ic"','class="ic" style="width:16px;height:16px"')}Part</span></div>${script(wide?13:9, sheet ? joined : lines)}</div>${sheet||''}</div>`);
V.parts = () => partsScreen();
V.line = () => partsScreen(`<div class="scrim"></div><div class="sheet"><div class="grab"></div>
 <p class="words">Of course, Pastor. [sound of opening door]<span class="at"></span>Good day to you, sir.</p>
