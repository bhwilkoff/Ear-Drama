<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B32 mock: the sound board</title>
<!-- B32 design mock, not product code. ?s=page|board|cast|states|ios|ipad|mac|android|mix &theme=light|dark &w=.
     The play's words are Caesar Rodney's Ride (Henry Fisk Carlton, Project Gutenberg 28051) lines L0172-L0191 and the
     cast of Toinette and the Elves (Gutenberg 58546), both through data.js (make_data.py over the real play library).
     Cue titles are the starter pack's proposed ids (B32-sound-board.md section 5); the only other words are the
     controls' labels. Fonts are the repo's, served from the repo root. -->
<script src="data.js"></script>
<style>
@font-face { font-family: "Big Shoulders"; src: url("../../../../fonts/big-shoulders.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Public Sans"; src: url("../../../../fonts/public-sans.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Public Sans"; src: url("../../../../fonts/public-sans-italic.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
:root { --bg:#FFFFFF; --surface:#F4F4F5; --alt:#E8E8EB; --text:#131316; --muted:#5C5C66; --border:#D8D8DD; --secondary:#0B6E99; --onsec:#fff;
  --primary:#131316; --onprimary:#fff; --record:#B0152F; --onrecord:#fff; --warning:#8A5300; --error:#C2410C;
  --mystery:#2459A5; --scifi:#007C88; --western:#864E37; --serial:#5A3983; --documentary:#2F6100;
  --display:"Big Shoulders", "Arial Narrow", sans-serif; --body:"Public Sans", system-ui, sans-serif; }
:root[data-theme="dark"] { --bg:#0F0F11; --surface:#19191C; --alt:#232327; --text:#F2F2F4; --muted:#C4C4CC; --border:#34343A; --secondary:#6CC0E0; --onsec:#06141B;
  --primary:#F2F2F4; --onprimary:#0F0F11; --record:#E3384B; --onrecord:#120708; --warning:#E8B04B; --error:#FF9466;
  --mystery:#8EBBFF; --scifi:#44D5D7; --western:#C99580; --serial:#AA87DE; --documentary:#7CB45A; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.f { fill: currentColor; stroke: none; }
.lbl { font: 600 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.l5 { font-size: 13px; color: var(--muted); }
.tab { font-variant-numeric: tabular-nums; }
/* ---- The reader page (css/styles.css .rd-* rules, condensed) ---- */
.rd { padding: 16px 16px 0 30px; position: relative; font-size: 17px; line-height: 1.5; }
.rd-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.rd-top .t { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rd-top .play { font-size: 13px; color: var(--muted); }
.sp { margin: 0 0 .7em; position: relative; }
.name { color: var(--hue); font-weight: 600; letter-spacing: .02em; display: block; }
.sfx { display: flex; align-items: flex-start; gap: 6px; margin: .3em 0; }
.sfx .txt { font-size: 13.5px; text-transform: uppercase; letter-spacing: .06em; background: var(--alt); padding: .15em .45em; border-radius: 4px; line-height: 1.45; }
.sfx .glyph { color: var(--muted); margin-top: 2px; }
.aside { font-style: italic; color: var(--muted); }
/* The Sound studio: a cue's state ring, and its chosen sounds as a line under the cue. */
.ring { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); flex: none; margin-top: 1px; display: grid; place-items: center; }
.ring.full { background: var(--text); border-color: var(--text); color: var(--bg); font: 700 11px var(--body); }
.slot { position: relative; }
.slot.cur { outline: 2px solid var(--text); outline-offset: 3px; border-radius: 4px; }
.chosen { margin: 2px 0 0 28px; font-size: 13px; color: var(--text); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.chosen span { display: inline-flex; align-items: center; gap: 4px; }
.chosen .at { color: var(--muted); }
.bed { position: absolute; left: 10px; width: 3px; background: var(--text); border-radius: 2px; opacity: .55; }
.bedlab { position: absolute; left: 4px; writing-mode: vertical-rl; transform: rotate(180deg); font: 600 10px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dim { opacity: .55; }
/* ---- The dock (WEB-DESIGN 4.16 item 14) ---- */
.dock { border-top: 1px solid var(--border); background: var(--bg); padding: 8px 12px 10px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 14px; min-height: 28px; }
.status b { font-weight: 600; }
.trans { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.ib { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--text); border: 0; background: none; }
.rec { width: 56px; height: 56px; border-radius: 28px; background: var(--record); color: var(--onrecord); display: grid; place-items: center; }
.rec i { width: 20px; height: 20px; border-radius: 50%; background: var(--onrecord); display: block; }
/* ---- The board (a <dialog> sheet on a phone, the studio panel when wide) ---- */
.sheet { background: var(--bg); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18); border-top: 1px solid var(--border); }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 8px auto 0; }
.bhead { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px 0; }
.bhead .done { color: var(--secondary); font-weight: 600; font-size: 15px; }
.cueq { padding: 6px 16px 10px; display: flex; gap: 8px; align-items: flex-start; }
.cueq .txt { font-size: 13.5px; text-transform: uppercase; letter-spacing: .06em; background: var(--alt); padding: .15em .45em; border-radius: 4px; }
.sec { padding: 4px 16px 8px; }
.chosenrow { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; min-height: 52px; }
.pb { width: 36px; height: 36px; border-radius: 18px; border: 1px solid var(--border); display: grid; place-items: center; color: var(--text); }
.pb.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.ttl { font-weight: 600; font-size: 15px; } .facts { font-size: 13px; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; height: 36px; margin: 8px 0; }
.seg span { display: grid; place-items: center; font-size: 14px; font-weight: 600; border-left: 1px solid var(--border); }
.seg span:first-child { border-left: 0; }
.seg span.on { background: var(--text); color: var(--bg); }
.kv { display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-top: 1px solid var(--border); font-size: 15px; }
.kv .v { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.step { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; height: 32px; }
.step span { width: 40px; display: grid; place-items: center; color: var(--text); }
.step span + span { border-left: 1px solid var(--border); }
.search { margin: 4px 16px 8px; display: flex; align-items: center; gap: 8px; height: 40px; border-radius: 10px; background: var(--surface); padding: 0 12px; border: 1px solid var(--border); color: var(--muted); }
.search b { color: var(--text); font-weight: 400; flex: 1; }
.chips { display: flex; gap: 8px; overflow: hidden; padding: 0 16px 8px; }
.chip { flex: none; height: 32px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 16px; border: 1px solid var(--border); font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--secondary); color: var(--onsec); border-color: var(--secondary); }
.res { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; min-height: 56px; padding: 0 16px; border-top: 1px solid var(--border); }
.res:last-child { border-bottom: 1px solid var(--border); }
.add { height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--border); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.add.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.grp { padding: 14px 16px 6px; display: flex; justify-content: space-between; align-items: center; }
.dl { display: inline-flex; align-items: center; gap: 6px; color: var(--secondary); font-weight: 600; font-size: 14px; }
.btn { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 600 14px var(--body); display: inline-flex; align-items: center; gap: 6px; }
.btn.recline { border-color: var(--record); color: var(--record); }
details summary { list-style: none; }
/* phone frame */
.phone { height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.phone .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.32); }
.phone .sheetwrap { position: absolute; left: 0; right: 0; bottom: 0; top: 64px; }
.phone .sheetwrap .sheet { height: 100%; overflow: hidden; }
/* cast sheet */
.cast { padding: 8px 16px; }
.crow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; min-height: 56px; border-bottom: 1px solid var(--border); }
.crow .n { font-weight: 600; } .crow .c { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.vchip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.dash { width: 16px; height: 16px; border-radius: 50%; border: 1.5px dashed var(--hue, var(--muted)); display: inline-block; }
/* states */
.st { border: 1px solid var(--border); border-radius: 12px; margin: 12px 16px; overflow: hidden; }
.st .cap { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.skel { height: 12px; border-radius: 6px; background: var(--alt); }
.empty { padding: 18px 16px; display: grid; gap: 10px; justify-items: start; }
/* iOS */
.ios { font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; --gbg:#F2F2F7; --cell:#FFFFFF; --sep:rgba(60,60,67,.29); --tint:#0B6E99; --sec2:rgba(60,60,67,.6); }
:root[data-theme="dark"] .ios { --gbg:#000000; --cell:#1C1C1E; --sep:rgba(84,84,88,.6); --tint:#6CC0E0; --sec2:rgba(235,235,245,.6); }
.ios .isheet { background: var(--gbg); border-radius: 12px 12px 0 0; height: 100%; overflow: hidden; }
.ios .nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 16px 6px; }
.ios .nav .c { font-weight: 600; font-size: 17px; text-align: center; }
.ios .nav .r { justify-self: end; color: var(--tint); font-weight: 600; font-size: 17px; }
.ios .gh { font-size: 13px; color: var(--sec2); text-transform: uppercase; padding: 14px 32px 6px; }
.ios .grp2 { background: var(--cell); border-radius: 10px; margin: 0 16px; overflow: hidden; }
.ios .cell { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 16px; position: relative; font-size: 17px; }
.ios .cell + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.ios .cell .sub { font-size: 15px; color: var(--sec2); }
.ios .cell .val { margin-left: auto; color: var(--sec2); display: flex; align-items: center; gap: 6px; }
.ios .iseg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: rgba(118,118,128,.12); border-radius: 9px; padding: 2px; height: 32px; width: 100%; }
.ios .iseg span { display: grid; place-items: center; font-size: 13px; font-weight: 500; border-radius: 7px; }
.ios .iseg span.on { background: var(--cell); box-shadow: 0 3px 8px rgba(0,0,0,.12); font-weight: 600; }
:root[data-theme="dark"] .ios .iseg span.on { background: #636366; }
.ios .isearch { margin: 6px 16px 8px; height: 36px; border-radius: 10px; background: rgba(118,118,128,.12); display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--sec2); font-size: 17px; }
.ios .isearch b { color: var(--text); font-weight: 400; }
.ios .tokens { display: flex; gap: 8px; padding: 2px 16px 4px; overflow: hidden; }
.ios .tok { flex: none; font-size: 15px; padding: 6px 12px; border-radius: 16px; background: var(--cell); }
.ios .tok.on { background: var(--tint); color: #fff; }
:root[data-theme="dark"] .ios .tok.on { color: #000; }
.ios .chk { color: var(--tint); margin-left: auto; }
.ios .pl { color: var(--tint); }
/* Android M3 */
.and { font-family: Roboto, "Google Sans", system-ui, sans-serif; --s:#FEF7FF; --sc:#F3EDF7; --sch:#ECE6F0; --on:#1D1B20; --onv:#49454F; --ol:#79747E; --olv:#CAC4D0; --pri:#0B6E99; --onpri:#fff; --sel:#CFE6F2; }
:root[data-theme="dark"] .and { --s:#141218; --sc:#211F26; --sch:#2B2930; --on:#E6E0E9; --onv:#CAC4D0; --ol:#938F99; --olv:#49454F; --pri:#6CC0E0; --onpri:#06141B; --sel:#1F4556; }
.and .asheet { background: var(--sc); border-radius: 28px 28px 0 0; height: 100%; overflow: hidden; color: var(--on); }
.and .handle { width: 32px; height: 4px; border-radius: 2px; background: var(--onv); opacity: .4; margin: 16px auto 8px; }
.and .ttl2 { font-size: 22px; padding: 4px 24px 2px; }
.and .aseg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--ol); border-radius: 20px; height: 40px; overflow: hidden; margin: 8px 24px; }
.and .aseg span { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 500; border-left: 1px solid var(--ol); }
.and .aseg span:first-child { border-left: 0; }
.and .aseg span.on { background: var(--sel); }
.and .asearch { margin: 8px 16px; height: 56px; border-radius: 28px; background: var(--sch); display: flex; align-items: center; gap: 12px; padding: 0 16px; color: var(--onv); }
.and .asearch b { color: var(--on); font-weight: 400; }
.and .fchips { display: flex; gap: 8px; padding: 0 16px 8px; overflow: hidden; }
.and .fc { flex: none; height: 32px; border: 1px solid var(--ol); border-radius: 8px; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; }
.and .fc.on { background: var(--sel); border-color: var(--sel); padding-left: 8px; }
.and .li { display: grid; grid-template-columns: 40px 1fr auto; gap: 16px; align-items: center; min-height: 72px; padding: 0 16px 0 16px; }
.and .li .h { font-size: 16px; } .and .li .s2 { font-size: 14px; color: var(--onv); }
.and .ic { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; background: var(--sch); }
.and .ic.on { background: var(--pri); color: var(--onpri); }
.and .tb { color: var(--pri); font-weight: 500; font-size: 14px; }
.and .tonal { height: 40px; border-radius: 20px; padding: 0 16px; background: var(--sel); display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: 14px; }
.and .div { border-top: 1px solid var(--olv); margin: 0 16px; }
.and .sub3 { font-size: 14px; color: var(--pri); font-weight: 500; padding: 16px 24px 4px; }
/* wide */
.wide { display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
.wide .pane { border-left: 1px solid var(--border); overflow: hidden; }
.mac .titlebar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
.mac .titlebar i { width: 12px; height: 12px; border-radius: 6px; display: block; background: #FF5F57; }
.mac .titlebar i:nth-child(2) { background: #FEBC2E; } .mac .titlebar i:nth-child(3) { background: #28C840; }
/* mix diagram */
.mix { padding: 28px 32px; }
.lane { display: grid; grid-template-columns: 110px 1fr; align-items: center; height: 70px; border-bottom: 1px solid var(--border); }
.lane .ln { font-weight: 600; font-size: 14px; }
.ax { position: relative; height: 100%; }
.blk { position: absolute; top: 18px; height: 34px; border-radius: 4px; font-size: 12px; font-weight: 600; padding: 2px 6px; color: #fff; overflow: hidden; white-space: nowrap; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
const S = P.get('s') || 'board';
document.documentElement.dataset.theme = P.get('theme') || 'light';
const I = {
  speaker: '<svg class="i" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  note: '<svg class="i" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  play: '<svg class="i f" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>',
  stop: '<svg class="i f" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg>',
  prev: '<svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  next: '<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  search: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>',
  board: '<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>',
  cloud: '<svg class="i" viewBox="0 0 24 24"><path d="M12 11v7m-3-3 3 3 3-3"/><path d="M7 17.5A4.5 4.5 0 0 1 7.5 8.5a5.5 5.5 0 0 1 10.6 1.6A3.8 3.8 0 0 1 17.5 17.5"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  mic: '<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  file: '<svg class="i" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>',
  warn: '<svg class="i" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.1"/></svg>',
  wave: '<svg class="i" viewBox="0 0 24 24"><path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 12h0"/></svg>',
  chev: '<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  down: '<svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
};
const HUE = { URIAH: 'mystery', RODNEY: 'scifi', MCKEEN: 'western', FRANKLIN: 'serial', PRUDENCE: 'documentary' };
const R = DATA.rodney;
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
// Cue state for the frames: what the person chose (by the proposed pack ids, section 5 of the doc).
const CHOSEN = {
  'L0172:1': [{ t: 'Take 1, performed', at: 'Under', take: true }, { t: 'Thunder, distant', at: 'After' }],
  'L0180:1': [{ t: 'Thunder, close', at: 'After' }],
  'L0180:2': [{ t: 'Rain, steady', at: 'Bed to line 191', bed: true }],
};
const CUR = 'L0180:1';
const cueNo = { 'L0171:1': 11, 'L0172:1': 12, 'L0180:1': 13, 'L0180:2': 14, 'L0190:1': 15, 'L0191:1': 16 };

function page({ studio = true, from = 0, to = 20, size = 17, cur = CUR } = {}) {
  let h = `<div class="rd" style="font-size:${size}px">`;
  for (const ln of R.lines.slice(from, to)) {
    const hue = HUE[ln.role] ? `var(--${HUE[ln.role]})` : 'var(--text)';
    h += `<div class="sp" data-line="${ln.id}" style="--hue:${hue}"><span class="name">${esc(ln.role)}</span>`;
    ln.parts.forEach((p, i) => {
      const k = Object.keys(p)[0];
      if (k === 'say') h += `<span>${esc(p.say)} </span>`;
      else if (k === 'direction') h += `<span class="aside">(${esc(p.direction)}) </span>`;
      else {
        const key = `${ln.id}:${i}`;
        const ch = CHOSEN[key];
        const ring = !studio ? '' : ch ? `<span class="ring full">${ch.length}</span>` : '<span class="ring"></span>';
        h += `<div class="slot${studio && key === cur ? ' cur' : ''}"><div class="sfx"><span class="glyph">${I.speaker}</span><span class="txt">${esc(p.sound)}</span>${ring}</div>`;
        if (studio && ch) h += `<div class="chosen">${ch.map(c => `<span>${c.bed ? I.note : c.take ? I.mic : I.speaker}${esc(c.t)} <span class="at">· ${c.at}</span></span>`).join('')}</div>`;
        h += '</div>';
      }
    });
    h += '</div>';
  }
  return h + '</div>';
}
function bedRule(root) {
  for (const rd of root.querySelectorAll('.rd')) {
    const sps = [...rd.querySelectorAll('.sp')].filter(e => e.dataset.line >= 'L0180' && e.dataset.line <= 'L0191');
    if (!sps.length) continue;
    const r0 = rd.getBoundingClientRect();
    const first = sps[0].dataset.line === 'L0180' ? sps[0].querySelectorAll('.slot')[1] : sps[0];
    const top = first.getBoundingClientRect().top - r0.top + 2;

function mixDiagram() {
  // An illustration of the computed duck (section 3): seconds 0-40 across 1200 px.
  const W = 1180, px = (s) => (s / 40) * W;
  const voice = [[0, 9.5, 'ANNOUNCER', 'var(--muted)'], [13.4, 14.6, 'RODNEY', 'var(--scifi)'], [15, 16.4, 'URIAH', 'var(--mystery)'], [16.8, 18, 'RODNEY', 'var(--scifi)'], [18.4, 20, 'URIAH', 'var(--mystery)'],
    [20.4, 22.6, 'RODNEY', 'var(--scifi)'], [23, 27, 'URIAH', 'var(--mystery)'], [27.4, 28.4, 'RODNEY', 'var(--scifi)'], [28.8, 29.6, 'URIAH', 'var(--mystery)'], [34.9, 36.2, 'RODNEY', 'var(--scifi)'], [36.6, 38, 'URIAH', 'var(--mystery)']];
  const blocks = (arr) => arr.map(([a, b, t, c]) => `<div class="blk" style="left:${px(a)}px;width:${px(b - a) - 1}px;background:${c}">${t}</div>`).join('');
  const fx = [[0, 9.5, 'Take 1, performed (under 172)', '#555'], [9.9, 13, 'Thunder, distant (after)', '#777'], [30, 34.5, 'Thunder, close (after 180)', '#777']];
  const bed = [[30, 40, 'Rain, steady (bed 180 to 191, fade in 1.5 s)', '#444']];
  const ivs = []; for (const [a, b] of voice) { if (ivs.length && a - ivs[ivs.length - 1][1] < 1) ivs[ivs.length - 1][1] = b; else ivs.push([a, b]); }
  const duckAt = (t, duck) => { let g = 0; for (const [a, b] of ivs) { let d = 0; if (t >= a && t <= b) d = 1; else if (t < a && t >= a - .12) d = (t - (a - .12)) / .12; else if (t > b && t <= b + .6) d = 1 - (t - b) / .6; g = Math.min(g, d * duck); } return g; };
  const env = (duck, segs, fadeIn = 0) => segs.map(([x0, x1]) => { const pts = []; for (let t = x0; t <= x1 + 1e-9; t += .02) { let g = duckAt(t, duck); if (fadeIn && t - x0 < fadeIn) g += -24 * (1 - (t - x0) / fadeIn); pts.push(`${px(t)},${18 + (-Math.max(g, -24) / 24) * 44}`); } return pts.join(' '); });
  const lane = (name, inner, svg) => `<div class="lane"><span class="ln">${name}</span><div class="ax">${inner}${svg ? `<svg width="${W}" height="70" style="position:absolute;left:0;top:0;overflow:visible">${svg.map(p => `<polyline points="${p}" fill="none" stroke="var(--record)" stroke-width="2"/>`).join('')}</svg>` : ''}</div></div>`;
  let ticks = ''; for (let s = 0; s <= 40; s += 5) ticks += `<span class="l5 tab" style="position:absolute;left:${px(s)}px">${s} s</span>`;
  return `<div class="mix"><div class="lbl" style="margin-bottom:8px">${esc(R.title)} · lines 172 to 182 · the duck is computed from where the takes sit, never heard from the audio</div>
  ${lane('Voices', blocks(voice))}
  ${lane('Effects', blocks(fx), env(-6, fx))}
  ${lane('Music and beds', blocks(bed), env(-12, bed, 1.5))}
  <div style="display:grid;grid-template-columns:110px 1fr"><span></span><div style="position:relative;height:24px;margin-top:6px">${ticks}</div></div>
  <div style="display:grid;grid-template-columns:110px 1fr;margin-top:18px;gap:0"><span></span><div style="display:flex;gap:32px;flex-wrap:wrap" class="l5">
    <span><b style="color:var(--record)">—</b> the cue's gain: top of the block is its own level, the block's foot −24 dB</span><span>effects −6 dB under a voice</span><span>music −12 dB under a voice</span><span>down 120 ms before a take starts</span><span>up over 600 ms after it ends</span><span>held down across gaps under 1 s</span><span>“After” and “Before” cues add their length to the gap; “Under” and beds add nothing</span></div></div></div>`;
}
