<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ear Drama Palettes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --page: #E9E9EA; --page-ink: #141416; --page-muted: #55555C; --page-rule: #C9C9CE; --page-card: #F7F7F8;
  --display: "Big Shoulders", "Big Shoulders Display", "Arial Narrow", sans-serif;
  --ui: "Public Sans", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #1B1B1E; --page-ink: #EEEEF0; --page-muted: #ABABB3; --page-rule: #38383E; --page-card: #232327; }
}
:root[data-theme="dark"] { --page: #1B1B1E; --page-ink: #EEEEF0; --page-muted: #ABABB3; --page-rule: #38383E; --page-card: #232327; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--page-ink); font-family: var(--ui); }
body { padding: 32px 16px 64px; }
.wrap { max-width: 1240px; margin: 0 auto; }
h1 { font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; margin: 0 0 12px; }
.lede { max-width: 68ch; line-height: 1.55; color: var(--page-muted); margin: 0 0 8px; }
section.dir { margin-top: 56px; padding-top: 32px; border-top: 1px solid var(--page-rule); }
section.dir h2 { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1; margin: 0 0 10px; }
.idea { max-width: 72ch; line-height: 1.55; margin: 0 0 20px; }
.mode-h { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 28px 0 12px; }
.swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 8px; }
.sw-panel { border-radius: 12px; padding: 16px; border: 1px solid var(--page-rule); }
.sw-panel h3 { font: 600 13px/1.2 var(--ui); margin: 0 0 10px; }
.sw-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { width: 100px; font: 400 11px/1.3 var(--ui); font-variant-numeric: tabular-nums; }
.chip i { display: block; height: 36px; border-radius: 6px; margin-bottom: 4px; border: 1px solid rgba(128,128,128,.35); }
.icon-row { display: flex; gap: 12px; align-items: center; }
.icon-tile { width: 72px; height: 72px; border-radius: 16px; display: grid; place-items: center; }
.icon-tile.small { width: 36px; height: 36px; border-radius: 8px; }
.aw { display: flex; gap: 6px; margin: 16px 0 0; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--page-muted); }
.aw span.c { width: 28px; height: 14px; border-radius: 3px; display: inline-block; }
.screens { display: flex; gap: 24px; flex-wrap: wrap; }
.tvbox { margin-top: 24px; width: 1173px; height: 660px; overflow: hidden; border-radius: 10px; border: 8px solid #050506; }
.tvbox > .tv { transform: scale(0.6047); transform-origin: 0 0; }

/* ---------- phone screens, all colors from per-screen variables ---------- */
.phone { width: 375px; height: 780px; border-radius: 44px; overflow: hidden; position: relative;
  background: var(--bg); color: var(--text); border: 1px solid var(--frame); flex: none;
  font-family: var(--ui); font-variant-numeric: tabular-nums; }
.phone .scroll { position: absolute; inset: 0 0 0 0; padding: 52px 16px 150px; overflow: hidden; }
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; justify-content: space-between;
  align-items: center; padding: 6px 30px 0; font: 600 15px var(--ui); color: var(--text); z-index: 3; }
.l1 { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: .95; margin: 0; letter-spacing: .005em; }
.l2 { font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.05; margin: 0; }
.l3 { font-weight: 600; font-size: 16px; line-height: 1.3; margin: 0; }
.l4 { font-weight: 400; font-size: 16px; line-height: 1.4; margin: 0; }
.l5 { font-weight: 400; font-size: 13px; line-height: 1.35; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }
.l6 { font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 0; }
.row-h { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 12px; }
.row-h a { color: var(--link); font-size: 15px; font-weight: 600; text-decoration: none; }
.continue { background: var(--surface); border-radius: 12px; padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.continue .l2 { font-size: 26px; }
.bar { height: 4px; border-radius: 2px; background: var(--surfaceAlt); position: relative; overflow: hidden; }
.bar b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--primary); border-radius: 2px; }
.playbtn { width: 48px; height: 48px; border-radius: 50%; background: var(--primary); display: grid; place-items: center; flex: none; }
.playbtn svg { fill: var(--onPrimary); }
.shelf { display: flex; gap: 12px; overflow: hidden; margin-right: -16px; }
.card { flex: none; width: 148px; height: 196px; background: var(--surface); border-radius: 12px; padding: 14px 12px 12px;
  display: flex; flex-direction: column; }
.gmark { display: flex; align-items: center; gap: 7px; }
.gmark i { display: block; width: 22px; height: 4px; border-radius: 2px; background: var(--g); flex: none; }
.gmark span { font-size: 12px; color: var(--muted); line-height: 1.2; }
.card .title { font-family: var(--display); font-weight: 700; font-size: 27px; line-height: .95; margin: 12px 0 0; flex: 1; }
.card .meta { font-size: 12.5px; color: var(--muted); }
.mini { position: absolute; left: 8px; right: 8px; bottom: 86px; background: var(--surfaceAlt); border-radius: 14px;
  padding: 10px 10px 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.mini .playbtn { width: 40px; height: 40px; grid-row: span 2; }
.mini .bar { grid-column: 1 / -1; height: 3px; margin-top: 8px; background: var(--border); }
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 82px; border-top: 1px solid var(--border);
  background: var(--bg); display: grid; grid-template-columns: repeat(4, 1fr); padding-top: 8px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
.tab svg { stroke: currentColor; fill: none; stroke-width: 1.8; }
.tab.on { color: var(--link); }
/* series page */
.back { color: var(--link); font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 4px; margin-bottom: 18px; }
.back svg { stroke: currentColor; fill: none; stroke-width: 2.2; }
.series-head .gmark { margin-bottom: 10px; }
.series-head .gmark i { width: 32px; height: 5px; }
.series-head .l1 { font-size: 56px; }
.actions { display: flex; gap: 10px; margin: 16px 0 6px; }
.btn { height: 44px; border-radius: 10px; padding: 0 18px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; }
.btn.fill { background: var(--primary); color: var(--onPrimary); }
.btn.fill svg { fill: var(--onPrimary); }
.btn.quiet { background: var(--surface); color: var(--text); }
.eps { margin-top: 18px; border-top: 1px solid var(--border); }
.ep { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: center; }
.ep .when { display: flex; gap: 8px; align-items: center; }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
.ep .dur { font-size: 13px; color: var(--muted); }
.ep.now .l3 { color: var(--text); }
/* now playing */
.np { position: absolute; inset: 0; padding: 60px 24px 34px; display: flex; flex-direction: column; }
.np .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 0 auto 26px; }
.np .series { display: flex; align-items: center; gap: 8px; }
.np .ep-title { font-family: var(--display); font-weight: 700; font-size: 60px; line-height: .92; margin: 16px 0 14px; }
.np .people { margin-top: 22px; display: grid; gap: 10px; }
.np .people .l4 b { font-weight: 600; }
.np .spacer { flex: 1; }
.scrub .bar { height: 5px; }
.scrub .times { display: flex; justify-content: space-between; margin-top: 8px; }
.controls { display: flex; justify-content: space-between; align-items: center; margin: 22px 8px 18px; }
.controls svg { stroke: var(--text); fill: none; stroke-width: 1.8; }
.controls .playbtn { width: 76px; height: 76px; }
.controls .playbtn svg { stroke: none; fill: var(--onPrimary); }
.np-foot { display: flex; justify-content: space-between; }
.np-foot span { color: var(--link); font-weight: 600; font-size: 15px; display: flex; gap: 6px; align-items: center; }
.np-foot svg { stroke: currentColor; fill: none; stroke-width: 1.8; }

/* ---------- TV, drawn at 1920x1080 then scaled ---------- */
.tv { width: 1920px; height: 1080px; background: var(--bg); color: var(--text); font-family: var(--ui); position: relative; overflow: hidden; font-variant-numeric: tabular-nums; }
.tv .top { position: absolute; top: 56px; left: 90px; right: 90px; display: flex; align-items: center; gap: 48px; font-size: 29px; font-weight: 600; color: var(--muted); }
.tv .top .mark { margin-right: 24px; }
.tv .top .on { color: var(--text); }
.tv .hero { position: absolute; top: 190px; left: 90px; width: 1100px; }
.tv .hero .gmark i { width: 40px; height: 6px; border-radius: 3px; }
.tv .hero .gmark span { font-size: 25px; }
.tv .hero h3 { font-family: var(--display); font-weight: 700; font-size: 104px; line-height: .9; margin: 22px 0 18px; }
.tv .hero p { font-size: 29px; margin: 0 0 8px; }
.tv .hero p.c { color: var(--muted); font-size: 25px; }
.tv .shelf-h { position: absolute; top: 606px; left: 90px; font-family: var(--display); font-weight: 600; font-size: 38px; }
.tv .tshelf { position: absolute; top: 676px; left: 90px; display: flex; gap: 40px; }
.tv .tcard { width: 300px; height: 330px; border-radius: 16px; background: var(--surface); padding: 26px 24px; display: flex; flex-direction: column; opacity: .62; }
.tv .tcard .gmark i { width: 34px; height: 6px; border-radius: 3px; }
.tv .tcard .gmark span { font-size: 23px; }
.tv .tcard .title { font-family: var(--display); font-weight: 700; font-size: 50px; line-height: .92; margin: 18px 0 0; flex: 1; }
.tv .tcard .meta { font-size: 23px; color: var(--muted); }
.tv .tcard.focus { opacity: 1; background: var(--surfaceAlt); transform: scale(1.1); transform-origin: center bottom;
  box-shadow: 0 0 0 5px var(--focus), 0 24px 48px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ear Drama palette directions</h1>
  <p class="lede">Three ways Ear Drama could look, each a brand palette and its own eight genre hues, drawn on the same four screens in light and dark. Every number on this page was measured; the method and the full tables are in README.md beside this file.</p>
  <div class="aw" id="aw"></div>
  <div id="dirs"></div>
</div>
<script>
const DATA = {"directions": {"onair": {"title": "On Air", "light": {"background": "#FFFFFF", "surface": "#F4F4F5", "surfaceAlt": "#E8E8EB", "text": "#131316", "textMuted": "#5C5C66", "border": "#D8D8DD", "primary": "#B0152F", "onPrimary": "#FFFFFF", "secondary": "#0B6E99", "onSecondary": "#FFFFFF", "link": "#0B6E99", "focus": "#0B6E99", "success": "#1D7A4A", "warning": "#8A5300", "error": "#C2410C", "errorSurface": "#FDEEE8"}, "dark": {"background": "#0F0F11", "surface": "#19191C", "surfaceAlt": "#232327", "text": "#F2F2F4", "textMuted": "#A6A6AF", "border": "#34343A", "primary": "#E3384B", "onPrimary": "#120708", "secondary": "#5AB4D6", "onSecondary": "#06141B", "link": "#6CC0E0", "focus": "#6CC0E0", "success": "#5CC593", "warning": "#E8B04B", "error": "#FF9466", "errorSurface": "#3A1F16"}, "genres": {"light": {"drama": "#B42575", "mystery": "#3753A2", "scifi": "#03838C", "western": "#A06841", "comedy": "#8D8300", "news": "#44420E", "documentary": "#217500", "serials": "#5D0087"}, "dark": {"drama": "#FF91C3", "mystery": "#8DACFA", "scifi": "#16E3F2", "western": "#D97E37", "comedy": "#E2D32B", "news": "#CECEC0", "documentary": "#81CB70", "serials": "#AE6DDC"}}, "idea": "A studio's red light meant the microphone was live: a WEEI studio sign photographed in Boston warns that silence is required while the red light is on, and Australia's national sound archive keeps a 1940 lightbox lit for the same reason. Here red is kept for the one thing that is live (Play, and what is playing), and the blue of 1930s mirrored-glass sets carries everything else you can touch.", "icon": {"light": {"ground": "#B0152F", "mic": "#FFFFFF", "note": "Icon: white ring microphone on tally red"}, "dark": {"ground": "#0F0F11", "mic": "#E3384B", "note": "Dark icon: red microphone on the studio black"}}}, "tuningeye": {"title": "Tuning Eye", "light": {"background": "#FFFFFF", "surface": "#F3F5F4", "surfaceAlt": "#E6EAE8", "text": "#111614", "textMuted": "#56605B", "border": "#D5DBD8", "primary": "#0F6B55", "onPrimary": "#FFFFFF", "secondary": "#5B3A29", "onSecondary": "#FFFFFF", "link": "#0F6B55", "focus": "#0F6B55", "success": "#3B6E14", "warning": "#8A5300", "error": "#B42318", "errorSurface": "#FDECEA"}, "dark": {"background": "#0D100F", "surface": "#161A18", "surfaceAlt": "#202522", "text": "#E9EEEB", "textMuted": "#A7B1AC", "border": "#2F3632", "primary": "#56D6A8", "onPrimary": "#06120D", "secondary": "#B98563", "onSecondary": "#160C06", "link": "#6EDDB4", "focus": "#6EDDB4", "success": "#A6D46A", "warning": "#E8B04B", "error": "#FF8A80", "errorSurface": "#3A1D1B"}, "genres": {"light": {"drama": "#960023", "mystery": "#1336A4", "scifi": "#B14CB2", "western": "#9B603D", "comedy": "#998100", "news": "#53574A", "documentary": "#116880", "serials": "#B66F7E"}, "dark": {"drama": "#CE3D4A", "mystery": "#5F88E8", "scifi": "#DC8DDB", "western": "#F78D4D", "comedy": "#F4D025", "news": "#A3B37D", "documentary": "#55D6FF", "serials": "#FCC8D1"}}, "idea": "From 1935, RCA's 6E5 tuning eye glowed green behind the dial, its dark wedge closing as a station came in, and Bakelite cabinets came out brown or black because the wood-flour filler that made them strong hid any lighter dye. Green means tuned in (Play, progress, the selected tab), on a near-neutral ground with walnut brown for the mark.", "icon": {"light": {"ground": "#0F6B55", "mic": "#FFFFFF", "note": "Icon: white microphone on tuning green"}, "dark": {"ground": "#0D100F", "mic": "#56D6A8", "note": "Dark icon: phosphor microphone on near-black"}}}, "catalin": {"title": "Catalin", "light": {"background": "#FFFFFF", "surface": "#F5F4F3", "surfaceAlt": "#EAE7E5", "text": "#17120F", "textMuted": "#615955", "border": "#DCD7D4", "primary": "#7A1F2B", "onPrimary": "#FFFFFF", "secondary": "#B7791F", "onSecondary": "#1A1206", "link": "#7A1F2B", "focus": "#7A1F2B", "success": "#1E7A4F", "warning": "#8A4B00", "error": "#C0261A", "errorSurface": "#FDECEA"}, "dark": {"background": "#110E0D", "surface": "#1B1716", "surfaceAlt": "#26201F", "text": "#F1ECE9", "textMuted": "#B3A9A4", "border": "#3A3230", "primary": "#E2A13B", "onPrimary": "#1A1206", "secondary": "#D06470", "onSecondary": "#120607", "link": "#EBB45A", "focus": "#EBB45A", "success": "#5CC593", "warning": "#F2C57A", "error": "#FF8A80", "errorSurface": "#3A1D1B"}, "genres": {"light": {"drama": "#CA2F7C", "mystery": "#0353AD", "scifi": "#058DA1", "western": "#AB5D47", "comedy": "#8F8400", "news": "#3C4333", "documentary": "#206F05", "serials": "#64266C"}, "dark": {"drama": "#F8A0C2", "mystery": "#70ABFE", "scifi": "#43DEFA", "western": "#CC8773", "comedy": "#E1D32B", "news": "#C5CEB9", "documentary": "#72C660", "serials": "#C269CE"}}, "idea": "Catalin was cast without filler, so late-1930s sets came in butterscotch, oxblood, and marbled onyx, and collectors note that red, black, and maroon kept their color while lighter shades yellowed toward butterscotch. Oxblood leads in light mode and butterscotch in dark, the pairing of a 1939 DeWald set in butterscotch with oxblood trim.", "icon": {"light": {"ground": "#7A1F2B", "mic": "#E2A13B", "note": "Icon: butterscotch microphone on oxblood"}, "dark": {"ground": "#110E0D", "mic": "#E2A13B", "note": "Dark icon: butterscotch microphone on onyx"}}}}, "archiveWatch": {"AW Feature Film": "#FF5C35", "AW Classic TV": "#2D5BFF", "AW Ephemeral": "#7C5BBA", "AW Silent Era": "#C9A66B", "AW Animation": "#FF4D8D", "AW Newsreel": "#8A8F98", "AW Documentary": "#3FA796", "AW Short Film": "#E8A317"}};
const GENRE_LABEL = { drama: 'Drama', mystery: 'Mystery', scifi: 'Science fiction', western: 'Western', comedy: 'Comedy', news: 'Wartime', documentary: 'Documentary', serials: 'Serials' };
const SHELF = [
  ['Suspense', 'mystery', 'CBS', '1942–1962'],
  ['Gunsmoke', 'western', 'CBS', '1952–1961'],
  ['Dimension X', 'scifi', 'NBC', '1950–1951'],
  ['The Jack Benny Program', 'comedy', 'NBC', '1932–1955'],
  ['Lux Radio Theatre', 'drama', 'CBS', '1934–1955'],
  ['Ma Perkins', 'serials', 'CBS', '1933–1960'],
  ['Words at War', 'news', 'NBC', '1943–1945'],
  ['You Are There', 'documentary', 'CBS', '1947–1950'],
];
const MIC = (fg, size) => `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
  <circle cx="50" cy="44" r="30" fill="none" stroke="${fg}" stroke-width="7"/>
  <circle cx="50" cy="44" r="13" fill="${fg}"/>
  ${[0,45,90,135,180,225,270,315].map(a => { const r = Math.PI*a/180; return `<line x1="${50+15*Math.cos(r)}" y1="${44+15*Math.sin(r)}" x2="${50+27*Math.cos(r)}" y2="${44+27*Math.sin(r)}" stroke="${fg}" stroke-width="2.6"/>`; }).join('')}
  <rect x="46" y="74" width="8" height="14" fill="${fg}"/><rect x="34" y="88" width="32" height="6" rx="3" fill="${fg}"/></svg>`;
const I = {
  play: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>`,
  pause: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>`,
  listen: `<svg width="26" height="26" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3.5" y="14" width="4" height="6" rx="1.5"/><rect x="16.5" y="14" width="4" height="6" rx="1.5"/></svg>`,
  radio: `<svg width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8l9-5"/><circle cx="15.5" cy="14" r="3"/><path d="M6.5 12.5h3M6.5 15.5h3"/></svg>`,

function vars(d, mode) {

const gm = k => `<div class="gmark" style="--g:var(--g-${k})"><i></i><span>${GENRE_LABEL[k]}</span></div>`;

const status = `<div class="statusbar"><span>9:41</span><span>100%</span></div>`;
const mini = `<div class="mini"><p class="l3">Sorry, Wrong Number</p><div class="playbtn">${I.pause(20)}</div><p class="l5">Suspense, 1943-05-25</p><div class="bar"><b style="width:42%"></b></div></div>`;

function listen(d, mode) {
  return `<div class="phone" style="${vars(d, mode)}">${status}<div class="scroll">
    <h2 class="l1">Listen</h2>
    <div class="row-h"><h3 class="l2">Continue</h3></div>
    <div class="continue">
      <div><p class="l2">Suspense</p></div><div class="playbtn" style="grid-row:span 3">${I.play(22)}</div>
      <p class="l3">Sorry, Wrong Number</p>
      <p class="l5">1943-05-25 CBS, 17 min left</p>
      <div class="bar" style="grid-column:1/-1;margin-top:10px"><b style="width:42%"></b></div>
    </div>
    <div class="row-h"><h3 class="l2">Series</h3><a>See all</a></div>
    <div class="shelf">${SHELF.slice(0, 4).map(([t, g, n, y]) => `<div class="card">${gm(g)}<p class="title">${t}</p><p class="meta">${n} ${y}</p></div>`).join('')}</div>
    <div class="row-h"><h3 class="l2">More series</h3></div>
    <div class="shelf">${SHELF.slice(4).map(([t, g, n, y]) => `<div class="card">${gm(g)}<p class="title">${t}</p><p class="meta">${n} ${y}</p></div>`).join('')}</div>
  </div>${mini}${tabs('Listen')}</div>`;
}
function series(d, mode) {
  const eps = [['1943-05-04', 'Death Flies Blind'], ['1943-05-11', 'Mr. Markham, Antique Dealer'], ['1943-05-18', 'The ABC Murders'],
    ['1943-05-25', 'Sorry, Wrong Number', 'Agnes Moorehead', true], ['1943-06-01', "Banquo's Chair"], ['1943-06-08', 'Five Canaries in the Room'], ['1943-06-15', 'Last Night']];
  return `<div class="phone" style="${vars(d, mode)}">${status}<div class="scroll">
    <div class="back">${I.chev}Listen</div>
    <div class="series-head">${gm('mystery')}<h2 class="l1">Suspense</h2>
      <p class="l5" style="margin-top:8px">CBS 1942–1962</p></div>
    <div class="actions"><span class="btn fill">${I.play(18)}Play first</span><span class="btn quiet">Follow</span></div>
    <div class="eps">${eps.map(([dt, t, who, now]) => `<div class="ep${now ? ' now' : ''}">
      <div><div class="when">${now ? '<span class="lamp"></span>' : ''}<p class="l5">${dt}</p></div><p class="l3">${t}</p>${who ? `<p class="l5">${who}</p>` : ''}</div>
      <span class="dur">${now ? '17 min left' : '30 min'}</span></div>`).join('')}</div>
  </div>${mini}${tabs('Listen')}</div>`;
}
function nowplaying(d, mode) {
  return `<div class="phone" style="${vars(d, mode)}">${status}<div class="np">
    <div class="grab"></div>
    <div class="series">${gm('mystery')}</div>
    <p class="l2" style="margin-top:14px">Suspense</p>
    <h2 class="ep-title">Sorry, Wrong Number</h2>
    <p class="l5">1943-05-25, CBS</p>
    <div class="people">
      <p class="l4"><b>Agnes Moorehead</b> as Mrs. Elbert Stevenson</p>
      <p class="l4"><b>Lucille Fletcher</b>, writer</p>
    </div>
    <div class="spacer"></div>
    <div class="scrub"><div class="bar"><b style="width:42%"></b></div><div class="times"><span class="l5">12:41</span><span class="l5">29:58</span></div></div>
    <div class="controls">${I.back15}<div class="playbtn">${I.pause(34)}</div>${I.fwd30}</div>
    <div class="np-foot"><span>${I.moon}Sleep</span><span>1x</span><span>${I.list}Up next</span></div>
  </div></div>`;
}
function tv(d, mode) {
  const cards = [SHELF[0], SHELF[1], SHELF[2], SHELF[3], SHELF[4]];
  return `<div class="tvbox"><div class="tv" style="${vars(d, mode)}">
    <div class="top"><span class="mark">${MIC(d[mode].text, 56)}</span><span class="on">Listen</span><span>Radio</span><span>Search</span><span>Library</span></div>
    <div class="hero">${gm('western')}<h3>Gunsmoke</h3>
      <p>Billy the Kid</p><p class="c">1952-04-26 CBS, William Conrad as Matt Dillon</p></div>
    <div class="shelf-h">Series</div>
    <div class="tshelf">${cards.map(([t, g, n, y], i) => `<div class="tcard${i === 1 ? ' focus' : ''}">${gm(g)}<p class="title">${t}</p><p class="meta">${n} ${y}</p></div>`).join('')}</div>
  </div></div>`;
}
function swatches(d) {
  const chip = (hex, name) => `<div class="chip"><i style="background:${hex}"></i>${name}<br>${hex}</div>`;
  const panel = mode => {
    const c = d[mode], g = d.genres[mode];
    return `<div class="sw-panel" style="background:${c.background};color:${c.text};border-color:${c.border}">
      <h3>${mode === 'light' ? 'Light' : 'Dark'}</h3>
      <div class="sw-row">${chip(c.primary, 'primary')}${chip(c.secondary, 'secondary')}${chip(c.link, 'link, focus')}${chip(c.background, 'background')}${chip(c.surface, 'surface')}${chip(c.text, 'text')}${chip(c.textMuted, 'muted')}</div>
      <div class="sw-row">${Object.keys(GENRE_LABEL).map(k => chip(g[k], GENRE_LABEL[k])).join('')}</div>
      <div class="icon-row">
        <div class="icon-tile" style="background:${d.icon[mode].ground}">${MIC(d.icon[mode].mic, 54)}</div>
        <div class="icon-tile small" style="background:${d.icon[mode].ground}">${MIC(d.icon[mode].mic, 28)}</div>
        <span style="font-size:12px;color:${c.textMuted}">${d.icon[mode].note}</span>
      </div></div>`;
  };
  return `<div class="swatches">${panel('light')}${panel('dark')}</div>`;
}
const only = new URLSearchParams(location.search).get('only');
document.getElementById('aw').innerHTML = 'Archive Watch genre hues, which Ear Drama must not reuse: ' +
  Object.entries(DATA.archiveWatch).map(([n, h]) => `<span class="c" style="background:${h}" title="${n}"></span>`).join('');
document.getElementById('dirs').innerHTML = Object.entries(DATA.directions).map(([key, d]) => {
  const modes = ['light', 'dark'].filter(m => !only || only === key + '-' + m || only === key);
  if (only && !modes.length) return '';
  return `<section class="dir" id="${key}"><h2>${d.title}</h2><p class="idea">${d.idea}</p>${!only || only === key ? swatches(d) : ''}
    ${modes.map(m => `<h3 class="mode-h">${m === 'light' ? 'Light' : 'Dark'}</h3>
      <div class="screens">${listen(d, m)}${series(d, m)}${nowplaying(d, m)}</div>${tv(d, m)}`).join('')}</section>`;
}).join('');
if (only) document.querySelector('h1').parentElement.querySelectorAll('h1,.lede,.aw').forEach(e => e.style.display = 'none');
</script>
</body>
</html>
