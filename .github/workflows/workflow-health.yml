# (Workflow/incident names in comments refer to Archive Watch, the origin repo.)
name: Workflow health

# Catch the ways a workflow can be broken while reporting success — which is
# every way this repo's CI has actually broken. word-index was green for months
# with 0 films; stock-index was green four times a day with 0 shots;
# omdb-backfill was green with an empty secret; faststart-derivatives fixed
# items and then skipped every publish step at GitHub's 360-minute cap.
#
# A red X gets noticed. None of those produced one. So this reads what each
# workflow's last completed run actually PRODUCED and says when the answer is
# "nothing" — and it runs on a schedule so nobody has to remember to look.
#
# It is deliberately a REPO artifact rather than a habit: the session that wrote
# it will end, and the checking should not end with it.

on:
  # DORMANT BY DEFAULT — uncomment once this repo has scheduled workflows
  # of its own to guard (see docs/CI-FLEET.md).
  # schedule:
  # - cron: '13 7 * * *'      # daily, off the hour so it does not pile onto :00
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'How far back to judge'
        required: false
        default: '36'

# Reads only. Never touches the catalog, so it takes no lock.
permissions:
  actions: read
  contents: read
  # The auditor reports through an issue rather than through a red X.
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # check_workflow_gates parses the workflow YAML; a runner has no pyyaml.
      - run: pip install --quiet pyyaml

      - name: Judge what every workflow last produced
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '36' }}
        run: |
          # The auditor exits 0 whenever it ran; a non-zero rc is its OWN
          # mechanics (gh unreachable) and must not skip the summary below.
          set +e
          python3 tools/audit_workflow_health.py | tee health.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          {
            echo '## Workflow health'
            echo '```'
            cat health.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A gate violation is a FINDING about some other workflow, so this step
      # reports it (a ::warning:: annotation per violation plus the step
      # summary) and stays green, like the audit above. The same checker is
      # what a PR or a local run uses as a hard gate; here it only reports.
      - name: Check every split workflow is fully gated
        run: |
          set +e
          python3 tools/check_workflow_gates.py > gates.log 2>&1
          rc=$?
          cat gates.log
          {
            echo '## Workflow gates'
            echo '```'
            cat gates.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            n=0
            while IFS= read -r line; do
              echo "::warning title=Workflow gate::${line#  }"
              n=$((n + 1))
            done < <(grep '^  ' gates.log)
            if [ "$n" -eq 0 ]; then
              echo "::warning title=Workflow gate::check_workflow_gates.py exited $rc with no violation lines; see the log"
            fi
          fi

      # An AUDITOR never fails (reporters never fail). Its job is to look and
      # report, and it did that; a workflow going red says IT could not do its
      # job. Failing here to signal somebody else's problem is a category error,
      # and an alert channel that cries wolf gets muted.
      #
      # Urgent findings (BROKEN, KILLED — the classes nothing else alerts for)
      # still need a channel that is not email-by-red-X, so they go to ONE
      # GitHub issue: opened when something is wrong, UPDATED in place while it
      # stays wrong, and CLOSED the moment the fleet is clean.
      - name: Raise or clear the health issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/report_workflow_health.py --summary "$GITHUB_STEP_SUMMARY"
