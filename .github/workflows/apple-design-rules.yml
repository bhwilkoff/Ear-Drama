# Apple design rules: the static checks in tools/test_apple_design_rules.py
# on every push that touches Swift. Kept out of appstore-build.yml, whose
# edited copy GitHub held as "may be malicious" (2026-11-09).
name: Apple design rules
on:
  push:
    branches: [main]
    paths:
      - 'apple/**'
      - 'tools/test_apple_design_rules.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test_apple_design_rules.py
