name: Operator

# A school's deletion request (Decision 084, docs/WORKER.md "A school asks"), with
# no stored key: GitHub issues this run a short-lived OIDC token whose audience is
# the Worker's origin, and the Worker lets in only this file, on main, dispatched
# (worker/src/github-oidc.js). Only people with write access can dispatch it:
#   gh workflow run operator.yml -f action=list -f reference="Lakeview District NDPA"
#   gh workflow run operator.yml -f action=delete-class -f class_id=<id>
# And the removal of an own script (docs/runbooks/reports.md): one production's, or
# every transcript of an episode a take-down names:
#   gh workflow run operator.yml -f action=remove-script -f production_id=<id>
#   gh workflow run operator.yml -f action=remove-episode-scripts -f episode_id=<id>
# The log is public, so it prints ids, dates and counts, never a class's name,
# code, or the school's reference. GitHub prints a step's `env:` before the step can
# mask anything, so no input is in one: each is read from the event file.

on:
  workflow_dispatch:
    inputs:
      action:
        description: list finds the classes; delete-class deletes one; remove-script and remove-episode-scripts drop an own script's words
        type: choice
        options: [list, delete-class, remove-script, remove-episode-scripts]
        required: true
      reference:
        description: the school's request reference (list)
        required: false
      code:
        description: a class code (list)
        required: false
      class_id:
        description: the class id from list (delete-class)
        required: false
      production_id:
        description: the production (remove-script)
        required: false
      episode_id:
        description: the episode the take-down names (remove-episode-scripts)
        required: false

concurrency:
  group: operator
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://eardrama-api.benwilkoff.workers.dev
    steps:
      - name: Ask the Worker
        shell: bash
        run: |
          set -euo pipefail
          input() { jq -r --arg k "$1" '.inputs[$k] // ""' "$GITHUB_EVENT_PATH"; }
          ACTION=$(input action); REFERENCE=$(input reference); CODE=$(input code); CLASS_ID=$(input class_id)
          PRODUCTION_ID=$(input production_id); EPISODE_ID=$(input episode_id)
          if [ -n "$REFERENCE" ]; then echo "::add-mask::$REFERENCE"; fi
          if [ -n "$CODE" ]; then echo "::add-mask::$CODE"; fi
          tok=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(jq -rn --arg v "$API" '$v|@uri')" | jq -r .value)
          echo "::add-mask::$tok"
          [ -n "$tok" ] && [ "$tok" != null ] || { echo "::error::no OIDC token"; exit 1; }
          out="$RUNNER_TEMP/answer.json"
          case "$ACTION" in
            list)
              if [ -n "$CODE" ]; then q="code=$(jq -rn --arg v "$CODE" '$v|@uri')"
              elif [ -n "$REFERENCE" ]; then q="reference=$(jq -rn --arg v "$REFERENCE" '$v|@uri')"
              else echo "::error::list needs a reference or a code"; exit 1; fi
              status=$(curl -sS -o "$out" -w '%{http_code}' -H "Authorization: Bearer $tok" "$API/v1/operator/classes?$q")
              echo "HTTP $status"
              [ "$status" = 200 ] || exit 1
              jq -r '"\(.classes | length) class(es)", (.classes[] | "\(.id) under13=\(.under13) created=\(.created_at / 1000 | floor | todate) ends_on=\(.ends_on // "-")")' "$out"
              ;;
            delete-class)
              [[ "$CLASS_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo "::error::delete-class needs a class_id from list"; exit 1; }
              status=$(curl -sS -o "$out" -w '%{http_code}' -X DELETE -H "Authorization: Bearer $tok" "$API/v1/operator/classes/$CLASS_ID")
              echo "HTTP $status"
              [ "$status" = 200 ] || exit 1
              jq -r '"deleted \(.class_id) at \(.deleted_at / 1000 | floor | todate)"' "$out"
              ;;
            remove-script)
              [[ "$PRODUCTION_ID" =~ ^[A-Za-z0-9_-]{8,64}$ ]] || { echo "::error::remove-script needs a production_id"; exit 1; }
              status=$(curl -sS -o "$out" -w '%{http_code}' -X DELETE -H "Authorization: Bearer $tok" "$API/v1/operator/scripts/$PRODUCTION_ID")
              echo "HTTP $status"
              [ "$status" = 204 ] || exit 1
              echo "removed the script of $PRODUCTION_ID"
              ;;
            remove-episode-scripts)
              [ -n "$EPISODE_ID" ] || { echo "::error::remove-episode-scripts needs an episode_id"; exit 1; }
              status=$(curl -sS -o "$out" -w '%{http_code}' -X DELETE -H "Authorization: Bearer $tok" "$API/v1/operator/scripts?episode=$(jq -rn --arg v "$EPISODE_ID" '$v|@uri')")
              echo "HTTP $status"
              [ "$status" = 200 ] || exit 1
              jq -r '"removed \(.removed) script(s)"' "$out"
              ;;
          esac
