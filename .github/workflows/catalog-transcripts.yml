# archive.org's automatic transcripts for the served catalog (DECISIONS 058;
# docs/CATALOG-CONTRACT.md §3.1, §3.4).
#
#   fetch    NO catalog lock. Restore the research database from the newest
#            dated catalog Release (recordings.has_transcript lives there, not
#            in the served projection) and the transcript cache (rolling
#            Release `transcripts-latest`, transcripts.json.gz), fetch the
#            next batch (catalog/tools/fetch_transcripts.py --batch:
#            stable-hash order, one request at a time with a pause, a contact
#            User-Agent, a budget that stops starting new fetches), run the
#            on-screen gate on each text, and refuse a cache smaller than the
#            one restored.
#   publish  holds `catalog-writers` for a minute or two: fetch
#            transcripts-latest FRESH, merge this run's cache into it
#            (additive: a text is never replaced by a miss or an error), refuse
#            a shrink, upload. The previous cache goes up first as
#            transcripts.prev.json.gz, so a failed --clobber never leaves the
#            Release empty.
#
# Bandwidth: a transcript is about 21 KB (median of 233 fetched 2026-10-22), so
# a batch of 1,200 is about 25 MB from archive.org. The served catalog has 8,999
# candidates (out/next, 2026-10-22): eight runs cover it, then a run only
# retries misses. The full cache is about 68 MB gzipped (233 entries measured
# 1.77 MB at gzip level 6; 181 MB of text), well inside a Release asset.
#
# Verdicts (docs/CI-FLEET.md §5): nothing due is green with a notice; texts were
# due and nothing came back (every request failed, or the breaker stopped the
# batch) is red. A transient failure (429, 5xx, a dropped connection) is never
# recorded, so the next run tries it again; a 404 is recorded as missing and
# retried after 30 days.
#
# The publish workflow (catalog-publish.yml) restores transcripts-latest and
# builds the FTS transcript column, has_transcript, and transcript_url from it;
# this workflow never touches the catalog Releases.

name: Catalog transcripts

on:
  schedule:
    - cron: '17 8 * * *'           # once a day, 2:17 AM MT; before the 9:41 UTC publish
  workflow_dispatch:
    inputs:
      batch:
        description: 'Transcripts to fetch this run (blank = the default)'
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REPO: ${{ github.repository }}
  # Measured 2026-10-22: 50 fetches in 2.6 minutes, 3.1 s a transcript with the
  # 1 s pause, so 1,200 is about 62 minutes, inside the 75-minute budget.
  BATCH: ${{ inputs.batch || '1200' }}
  MAX_MINUTES: '75'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    concurrency:
      group: catalog-transcripts-fetch
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      changed: ${{ steps.verdict.outputs.changed }}
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore the research database (newest dated catalog Release)
        run: |
          set -euo pipefail
          # No research database, nothing to fetch against: red, never a guess.
          tag=$(gh release list -R "$REPO" --limit 100 --json tagName \
            --jq '[.[].tagName | select(test("^catalog-[0-9]{4}-[0-9]{2}-[0-9]{2}$"))] | sort | last // empty')
          if [ -z "$tag" ]; then
            echo "::error::no dated catalog Release (catalog-YYYY-MM-DD) to restore from"
            exit 1
          fi
          mkdir -p work
          bash tools/gh_retry.sh gh release download "$tag" -R "$REPO" -D work --clobber \
            -p radio-catalog.sqlite.xz -p SHA256SUMS
          (cd work && sha256sum -c --ignore-missing SHA256SUMS)
          xz -dc work/radio-catalog.sqlite.xz > work/radio-catalog.sqlite
          rm work/radio-catalog.sqlite.xz
          echo "research database from $tag: $(python3 -c "import sqlite3;print(sqlite3.connect('work/radio-catalog.sqlite').execute('SELECT COUNT(*) FROM recordings WHERE rank = 0 AND has_transcript = 1').fetchone()[0])") default copies with a transcript"

      - name: Restore the transcript cache (transcripts-latest)
        id: restore
        run: |
          set -euo pipefail
          # Only a NON-EXISTENT release is a first run (docs/CI-FLEET.md §3).
          if out=$(gh release view transcripts-latest -R "$REPO" --json assets --jq '[.assets[].name] | join(" ")' 2>&1); then
            case " $out " in
              *" transcripts.json.gz "*) asset=transcripts.json.gz ;;
              *" transcripts.prev.json.gz "*)
                asset=transcripts.prev.json.gz
                echo "::warning::transcripts-latest has no transcripts.json.gz (a publish failed mid-upload); restoring transcripts.prev.json.gz" ;;
              *) echo "::error::transcripts-latest exists with no cache (assets: $out)"; exit 1 ;;
            esac
            bash tools/gh_retry.sh gh release download transcripts-latest -R "$REPO" -D work --clobber -p "$asset"
            mv "work/$asset" work/restored.json.gz
          elif printf '%s' "$out" | grep -q "release not found"; then
            echo "no transcripts-latest Release yet: first run"
            python3 -c "import gzip,json;json.dump({}, gzip.open('work/restored.json.gz','wt'))"
          else
            echo "::error::could not read transcripts-latest: $out"
            exit 1
          fi
          cp work/restored.json.gz work/transcripts.json.gz
          python3 catalog/tools/fetch_transcripts.py --guard work/restored.json.gz work/transcripts.json.gz

      - name: Fetch one batch
        id: fetch
        timeout-minutes: 90         # backstop above the tool's own budget; the verdict decides
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 catalog/tools/fetch_transcripts.py --batch "$BATCH" \
            --db work/radio-catalog.sqlite --cache work/transcripts.json.gz \
            --max-minutes "$MAX_MINUTES" --summary work/summary.json

      - name: Refuse a cache smaller than the one restored
        id: guard
        if: always() && steps.restore.outcome == 'success'
        run: python3 catalog/tools/fetch_transcripts.py --guard work/restored.json.gz work/transcripts.json.gz

      - name: Verdict
        id: verdict
        if: always() && steps.guard.outcome == 'success'
        run: |
          set -euo pipefail
          # Growth is read from the caches themselves, so a backstop that killed
          # the tool before its summary still publishes what it saved.
          changed=$(python3 -c "
          import sys; sys.path.insert(0, 'catalog/tools')
          import fetch_transcripts as T
          a, b = T.load('work/restored.json.gz'), T.load('work/transcripts.json.gz')
          print('yes' if T.merge(a, b) != a else 'no')")
          verdict=$(python3 -c "import json;print(json.load(open('work/summary.json'))['verdict'])" 2>/dev/null || echo killed)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          if [ -f work/summary.json ]; then
            python3 -c "import json;s=json.load(open('work/summary.json'));print(json.dumps(s, indent=1))" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          case "$verdict/$changed/${{ steps.fetch.outcome }}" in
            idle/*) echo "::notice::nothing due: every candidate is cached or waiting its retry window" ;;
            fetched/*/success) ;;
            all_failed/*) echo "::error::transcripts were due and nothing came back (every request failed, or the breaker stopped the batch)" ;;
            killed/yes/*) echo "::warning::the fetch step was stopped by its backstop; publishing what it saved" ;;
            killed/no/*) echo "::error::the fetch step failed before fetching anything" ;;
            *) echo "::error::fetch step outcome ${{ steps.fetch.outcome }} with verdict $verdict" ;;
          esac

      - name: Keep this run's cache for the publish job
        if: always() && steps.verdict.outputs.changed == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-run
          path: work/transcripts.json.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: fetch
    if: always() && needs.fetch.outputs.changed == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The catalog writers' lock, held only for fetch-merge-upload (docs/CI-FLEET.md §1).
    concurrency:
      group: catalog-writers
      cancel-in-progress: false
    permissions:
      contents: write             # the transcripts-latest Release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: transcripts-run
          path: run

      - name: Fetch what is published now (fresh, under the lock)
        id: live
        run: |
          set -euo pipefail
          mkdir -p live
          if out=$(gh release view transcripts-latest -R "$REPO" --json assets --jq '[.assets[].name] | join(" ")' 2>&1); then
            echo "release=yes" >> "$GITHUB_OUTPUT"
            case " $out " in
              *" transcripts.json.gz "*) asset=transcripts.json.gz ;;
              *" transcripts.prev.json.gz "*) asset=transcripts.prev.json.gz; echo "::warning::merging over transcripts.prev.json.gz" ;;
              *) echo "::error::transcripts-latest exists with no cache (assets: $out)"; exit 1 ;;
            esac
            bash tools/gh_retry.sh gh release download transcripts-latest -R "$REPO" -D live --clobber -p "$asset"
            mv "live/$asset" live/fresh.json.gz
          elif printf '%s' "$out" | grep -q "release not found"; then
            echo "release=no" >> "$GITHUB_OUTPUT"
            python3 -c "import gzip,json;json.dump({}, gzip.open('live/fresh.json.gz','wt'))"
          else
            echo "::error::could not read transcripts-latest: $out"
            exit 1
          fi

      - name: Merge, and refuse a shrink
        run: |
          set -euo pipefail
          python3 catalog/tools/fetch_transcripts.py --merge live/fresh.json.gz run/transcripts.json.gz --out live/transcripts.json.gz
          python3 catalog/tools/fetch_transcripts.py --guard live/fresh.json.gz live/transcripts.json.gz
          python3 catalog/tools/fetch_transcripts.py --guard run/transcripts.json.gz live/transcripts.json.gz

      - name: Upload to the rolling Release transcripts-latest
        run: |
          set -euo pipefail
          if [ "${{ steps.live.outputs.release }}" = "no" ]; then
            bash tools/gh_retry.sh gh release create transcripts-latest -R "$REPO" --latest=false \
              --title "Transcripts (rolling)" \
              --notes "archive.org's automatic transcripts of each served episode's default copy, with the on-screen gate's verdict (catalog/tools/fetch_transcripts.py): transcripts.json.gz, and transcripts.prev.json.gz, the one before. Written by .github/workflows/catalog-transcripts.yml; read by catalog-publish.yml into the projection's search index, has_transcript, and transcript_url. Never read by a client."
          else
            # --clobber deletes before it uploads: the old cache goes up under
            # its own name first, so the Release is never left empty.
            cp live/fresh.json.gz live/transcripts.prev.json.gz
            bash tools/gh_retry.sh gh release upload transcripts-latest -R "$REPO" --clobber live/transcripts.prev.json.gz
          fi
          bash tools/gh_retry.sh gh release upload transcripts-latest -R "$REPO" --clobber live/transcripts.json.gz
          want=$(stat -c %s live/transcripts.json.gz)
          got=$(gh release view transcripts-latest -R "$REPO" --json assets --jq '.assets[] | select(.name == "transcripts.json.gz") | .size')
          if [ "$got" != "$want" ]; then
            echo "::error::transcripts-latest/transcripts.json.gz is ${got:-missing} bytes; built $want"
            exit 1
          fi
          # The yield line tools/audit_workflow_health.py judges a green run by.
          echo "[catalog-transcripts] published $(python3 -c "
          import sys; sys.path.insert(0, 'catalog/tools')
          import fetch_transcripts as T
          t = T.tally(T.load('live/transcripts.json.gz'))
          print(t['texts'], 'texts,', t['shown'], 'shown,', t['missing'], 'missing,', t['errors'], 'errors of', t['entries'], 'ids')") to transcripts-latest ($got bytes)"

  verdict:
    needs: [fetch, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A red X only for broken
        env:
          FETCH: ${{ needs.fetch.result }}
          VERDICT: ${{ needs.fetch.outputs.verdict }}
          CHANGED: ${{ needs.fetch.outputs.changed }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          echo "fetch=$FETCH verdict=$VERDICT changed=$CHANGED publish=$PUBLISH"
          if [ "$CHANGED" = "yes" ] && [ "$PUBLISH" != "success" ]; then
            echo "::error::fetched, but the publish job did not succeed ($PUBLISH)"
            exit 1
          fi
          case "$VERDICT" in
            idle|fetched) ;;
            killed) [ "$CHANGED" = "yes" ] || { echo "::error::nothing fetched before the backstop"; exit 1; } ;;
            all_failed) echo "::error::transcripts were due and nothing came back"; exit 1 ;;
            *) echo "::error::the fetch job did not reach a verdict ($FETCH)"; exit 1 ;;
          esac
          if [ "$FETCH" = "failure" ] && [ "$VERDICT" != "killed" ]; then
            echo "::error::the fetch job failed"
            exit 1
          fi
