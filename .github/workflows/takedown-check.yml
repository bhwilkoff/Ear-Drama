name: Takedown check

# Reads open take-down cases from the private record, checks what each names, and
# applies what the rule decides (catalog/DECISIONS.md 029). The log is public:
# catalog/tools/takedown_cases.py prints case numbers, served catalog keys and
# fixed reasons only, and catalog/tests/test_takedown_check.py proves it with
# planted data. Needs the repository secret TAKEDOWN_TOKEN.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: takedown-check
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAKEDOWN_TOKEN: ${{ secrets.TAKEDOWN_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the rule and the log's privacy
        run: python catalog/tests/test_takedown_check.py
      - name: Judge open cases
        run: python catalog/tools/takedown_cases.py judge --out "$RUNNER_TEMP/updates.json"
      - name: Publish the list
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/editorial/takedowns.json
          if git diff --cached --quiet; then
            echo "nothing to remove"; echo "removed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "Take-down cases: update the list [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "removed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep $((i * 10))
          done
          echo "::error::could not push the take-down list"; exit 1
      # Recorded only after the list is on main, so a failed push leaves the case
      # open for the next run instead of closed with the recording still served.
      - name: Record the outcome
        run: python catalog/tools/takedown_cases.py report --updates "$RUNNER_TEMP/updates.json"
      - name: Publish the catalog
        if: steps.push.outputs.removed == 'true'
        run: gh workflow run catalog-publish.yml
