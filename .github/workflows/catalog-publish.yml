# The catalog publish step (LOOP-PLAN M1; docs/CATALOG-CONTRACT.md §2, §7).
#
#   build    NO lock. Restore the research database and harvest caches from the
#            newest dated catalog Release, rebuild (build_db, enrich_db), run
#            every catalog suite, restore the loudness cache (loudness-latest,
#            written by catalog-loudness.yml; missing = columns left NULL),
#            restore the transcript cache (transcripts-latest, written by
#            catalog-transcripts.yml; missing = none searchable or shown),
#            fetch the live projection (catalog-latest), build the served
#            projection forwarding every id and series key the live one served and this one
#            does not (contract §3.5: an alias, or a tombstone), the clean-only
#            projection taking the same forwarding, and the web projection,
#            run the contract tests over the real
#            artifacts, build tonight.json (Tonight in 19xx, contract §8:
#            restore the measured evenings from radiologs-latest, fetch only
#            the window's missing newspaper logs, politely and capped, and
#            merge onto the published file), build stations.json (the genre
#            stations, contract §8, kept as published and extended four days),
#            and print what this publish
#            would change.
#   publish  holds `catalog-writers`, the one lock every catalog writer shares,
#            for a few minutes. Re-reads what is published NOW, refuses a
#            shrink past the floor, a forwarding computed against a catalog
#            that is no longer live, or a change to a published evening, uploads
#            ear-drama.sqlite.zz + tonight.json + manifest.json to the rolling
#            Release `catalog-latest` and the grown evening cache to
#            `radiologs-latest`, and deploys the site with the web projection
#            (and its tonight.json) under /data/ to Pages.
#
# radiologs-latest holds facts only (evenings.jsonl, log-urls.json), never the
# newspaper PDFs. Without it a run measures the window from scratch, at most
# 120 PDFs a run, so the first runs fill the nearest days first. To seed it from
# a machine that already measured: tar -cJf radiologs.tar.xz -C catalog/.cache
# radiologs/evenings.jsonl radiologs/log-urls.json, then upload it to a
# radiologs-latest Release.
#
# A run that read nothing goes red: no dated Release, a checksum mismatch, an
# empty build, a red suite, or a projection under its floor each fail the run
# before anything is published. A red X is reserved for broken (docs/CI-FLEET.md
# section 5): Pages not yet served from Actions is a warning, not a failure.
#
# The public-web gate (contract §6): the web projection serves `clean` rows only
# unless the repository variable DMCA_AGENT_REGISTERED is exactly 'true'
# (Settings > Secrets and variables > Actions > Variables). The native apps'
# projection serves clean and unclaimed rows either way.
#
# Pages: this deploys through Actions, so it needs Settings > Pages > Source set
# to "GitHub Actions". Until then (build_type 'legacy', main served from the
# repo root) the Pages steps are skipped with a warning and the Release still
# publishes. Once switched, THIS workflow is what puts the site on Pages: a
# push to main no longer changes eardrama.org until the next run or a dispatch.
#
# Push events do not start workflows in this repo (measured), so it runs on a
# schedule and on dispatch.

name: Catalog publish

on:
  schedule:
    - cron: '41 9 * * *'          # daily, off the hour; crons land hours late
  workflow_dispatch:
    inputs:
      shrink_reason:
        description: 'Recorded reason that lets a catalog shrink past the floor publish (blank = refuse)'
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash                   # explicit shell = bash -eo pipefail: `tool | tee` cannot hide a crash

env:
  REPO: ${{ github.repository }}
  # The merge guard's floor: a publish that serves more than this fraction
  # fewer episodes than the one live now is refused without a recorded reason
  # (Archive Watch Decision 020). Takedowns and single-rule changes sit well
  # inside it; a broken parse or a half-read cache does not.
  MAX_SHRINK: '0.02'
  # Plumbing, not policy: the rebuild against the snapshot it was restored
  # from. Looser, because a dated snapshot can predate rights rulings the
  # current audit applies (the 2026-10-21 snapshot serves 121,907; the
  # 2026-10-22 audit 116,380, -4.5%).
  RESEARCH_FLOOR: '0.10'
  SHRINK_REASON: ${{ inputs.shrink_reason }}
  # Set iteration in build_db/enrich follows the hash seed: two builds from one
  # cache differed in 105 episodes' network/star and 29 credits (C1, 2026-10-28).
  PYTHONHASHSEED: '0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DMCA_AGENT_REGISTERED: ${{ vars.DMCA_AGENT_REGISTERED }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore the research database and caches (newest dated catalog Release)
        id: restore
        run: |
          # Never `|| true` a restore: with nothing restored, build_db builds
          # from nothing (docs/CI-FLEET.md section 3).
          # --exclude-drafts: tools/cut_catalog_release.sh builds a new one as a draft
          # and publishes it only once every asset matches its checksum.
          tag=$(gh release list -R "$REPO" --limit 100 --exclude-drafts --json tagName \
            --jq '[.[].tagName | select(test("^catalog-[0-9]{4}-[0-9]{2}-[0-9]{2}$"))] | sort | last // empty')
          if [ -z "$tag" ]; then
            echo "::error::no dated catalog Release (catalog-YYYY-MM-DD) to restore from"
            exit 1
          fi
          echo "restoring from $tag"
          mkdir -p catalog/dist catalog/out catalog/.cache
          bash tools/gh_retry.sh gh release download "$tag" -R "$REPO" -D catalog/dist --clobber \
            -p radio-catalog.sqlite.xz -p harvest-cache.tar.xz -p SHA256SUMS
          (cd catalog/dist && sha256sum -c --ignore-missing SHA256SUMS)
          xz -dc catalog/dist/radio-catalog.sqlite.xz > catalog/out/restored.sqlite
          xz -dc catalog/dist/harvest-cache.tar.xz | tar -x -C catalog/.cache
          rm -f catalog/dist/*.xz
          echo "cache files: $(find catalog/.cache -type f | wc -l)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Rebuild (build_db, then every enrich step)
        working-directory: catalog
        run: |
          set -euo pipefail
          python3 tools/build_db.py 2>&1 | tee out/build.log
          python3 tools/enrich_db.py 2>&1 | tail -5
          # Each adds its own tables (Wikidata, witnesses, external facts, art, portraits,
          # archive photos, magazine rights); without them the published database silently
          # lacks what the restored snapshot had (found 2026-10-22, loop tick 36).
          python3 tools/enrich_external.py 2>&1 | tail -5
          python3 tools/enrich_people_art.py 2>&1 | tail -5
          python3 tools/enrich_photo_archives.py 2>&1 | tail -5

      - name: Every catalog suite (a red test blocks publish)
        run: bash catalog/tests/run_all.sh

      - name: Restore the loudness measurements (loudness-latest)
        run: |
          # catalog-loudness.yml writes it. No Release or no cache asset means
          # no loudness columns are filled this publish, not a failure; a cache
          # that exists and cannot be fetched is an error (never swallow a restore).
          if out=$(gh release view loudness-latest -R "$REPO" --json assets --jq '[.assets[].name] | join(" ")' 2>&1); then
            case " $out " in
              *" loudness.json.gz "*) asset=loudness.json.gz ;;
              *" loudness.prev.json.gz "*) asset=loudness.prev.json.gz; echo "::warning::loudness-latest has only loudness.prev.json.gz" ;;
              *) echo "::warning::loudness-latest has no cache (assets: $out); publishing without loudness"; exit 0 ;;
            esac
            bash tools/gh_retry.sh gh release download loudness-latest -R "$REPO" -D catalog/out --clobber -p "$asset"
            if [ "$asset" != loudness.json.gz ]; then mv "catalog/out/$asset" catalog/out/loudness.json.gz; fi
            echo "loudness: $(python3 -c "import sys;sys.path.insert(0,'catalog/tools');import measure_loudness as L;print(L.tally(L.load('catalog/out/loudness.json.gz')))")"
          elif printf '%s' "$out" | grep -q "release not found"; then
            echo "::notice::no loudness-latest Release yet: publishing without loudness"
          else
            echo "::error::could not read loudness-latest: $out"
            exit 1
          fi

      - name: Restore the transcripts (transcripts-latest)
        run: |
          # catalog-transcripts.yml writes it. No Release or no cache asset means
          # no transcript is searchable or shown this publish, not a failure; a
          # cache that exists and cannot be fetched is an error.
          if out=$(gh release view transcripts-latest -R "$REPO" --json assets --jq '[.assets[].name] | join(" ")' 2>&1); then
            case " $out " in
              *" transcripts.json.gz "*) asset=transcripts.json.gz ;;
              *" transcripts.prev.json.gz "*) asset=transcripts.prev.json.gz; echo "::warning::transcripts-latest has only transcripts.prev.json.gz" ;;
              *) echo "::warning::transcripts-latest has no cache (assets: $out); publishing without transcripts"; exit 0 ;;
            esac
            bash tools/gh_retry.sh gh release download transcripts-latest -R "$REPO" -D catalog/out --clobber -p "$asset"
            if [ "$asset" != transcripts.json.gz ]; then mv "catalog/out/$asset" catalog/out/transcripts.json.gz; fi
            echo "transcripts: $(python3 -c "import sys;sys.path.insert(0,'catalog/tools');import fetch_transcripts as T;print(T.tally(T.load('catalog/out/transcripts.json.gz')))")"
          elif printf '%s' "$out" | grep -q "release not found"; then
            echo "::notice::no transcripts-latest Release yet: publishing without transcripts"
          else
            echo "::error::could not read transcripts-latest: $out"
            exit 1
          fi

      - name: Fetch the live projection (the ids this publish forwards)
        run: |
          # Contract §3.5: every id the live projection serves that this build does not is
          # aliased or tombstoned, so the live one is read before the build. No Release is a
          # first publish (nothing to forward); one that exists and cannot be read is an error,
          # never a build that silently forwards nothing.
          mkdir -p live
          if out=$(gh release view catalog-latest -R "$REPO" --json assets --jq '[.assets[].name] | join(" ")' 2>&1); then
            # Each name is matched on its own: a pattern holding both shares one space between
            # adjacent names and never matched "ear-drama.sqlite.zz manifest.json" (2026-10-28).
            both=no
            case " $out " in *" ear-drama.sqlite.zz "*) case " $out " in *" manifest.json "*) both=yes ;; esac ;; esac
            case "$both" in
              yes)
                bash tools/gh_retry.sh gh release download catalog-latest -R "$REPO" -D live --clobber \
                  -p manifest.json -p ear-drama.sqlite.zz
                want=$(python3 -c "import json;print(json.load(open('live/manifest.json'))['sha256']['zz'])")
                got=$(sha256sum live/ear-drama.sqlite.zz | cut -d' ' -f1)
                if [ "$got" != "$want" ]; then
                  echo "::error::live ear-drama.sqlite.zz is $got; its manifest vouches for $want"
                  exit 1
                fi
                echo "forwarding against the live projection, sha256 $got" ;;
              *)
                # The same emergency the publish job names: only a recorded reason republishes over it.
                if [ -z "$SHRINK_REASON" ]; then
                  echo "::error::catalog-latest exists without ear-drama.sqlite.zz and manifest.json (assets: $out); dispatch with a shrink_reason to republish over it"
                  exit 1
                fi
                echo "::warning::catalog-latest has no readable projection; forwarding nothing for the recorded reason: $SHRINK_REASON" ;;
            esac
          elif printf '%s' "$out" | grep -q "release not found"; then
            echo "no catalog-latest Release yet: a first publish forwards nothing"
          else
            echo "::error::could not read catalog-latest: $out"
            exit 1
          fi

      - name: Build the served, clean-only, and web projections
        working-directory: catalog
        run: |
          set -euo pipefail
          prev=()
          if [ -s ../live/ear-drama.sqlite.zz ]; then prev=(--previous ../live/ear-drama.sqlite.zz); fi
          loud=()
          if [ -s out/loudness.json.gz ]; then loud=(--loudness out/loudness.json.gz); fi
          if [ -s out/transcripts.json.gz ]; then loud+=(--transcripts out/transcripts.json.gz); fi
          python3 tools/build_projection.py --out out/publish "${prev[@]}" "${loud[@]}" | tail -3
          python3 tools/build_projection.py --clean-only --out out/publish-clean \
            --forwarding-from out/publish/ear-drama.sqlite "${loud[@]}" | tail -3
          echo "forwarding: $(python3 -c "import json;m=json.load(open('out/publish/manifest.json'));c=m['counts'];print(c['aliases'], 'aliases,', c['tombstones'], 'tombstones,', c['seriesAliases'], 'series aliases,', c['seriesTombstones'], 'series tombstones;', m['forwarding'])")"
          echo "loudness rows: $(python3 -c "import json;print(json.load(open('out/publish/manifest.json'))['counts']['loudness'])")"
          echo "transcripts shown / searchable: $(python3 -c "import json;c=json.load(open('out/publish/manifest.json'))['counts'];print(c['transcripts'], '/', c['transcriptsSearchable'])")"
          # The public-web gate: one flag, opened only by the repository variable.
          gate=""
          if [ "${DMCA_AGENT_REGISTERED:-}" = "true" ]; then gate="--include-unclaimed"; fi
          said=()
          if [ -s out/transcripts.json.gz ]; then said=(--transcripts out/transcripts.json.gz); fi
          python3 tools/build_web_projection.py --src out/publish/ear-drama.sqlite --out out/web $gate "${said[@]}" > out/web.log
          head -12 out/web.log
          want=$([ -n "$gate" ] && echo False || echo True)
          got=$(python3 -c "import json;print(json.load(open('out/web/manifest.json'))['cleanOnly'])")
          if [ "$got" != "$want" ]; then
            echo "::error::web projection cleanOnly=$got, but the gate says $want"
            exit 1
          fi
          echo "web projection: cleanOnly=$got"

      - name: Contract tests over the real artifacts
        working-directory: catalog
        run: |
          PROJECTION=out/publish/ear-drama.sqlite python3 tests/test_projection.py
          PROJECTION=out/publish-clean/ear-drama.sqlite python3 tests/test_projection.py
          PROJECTION=out/publish/ear-drama.sqlite SOURCE=out/radio-catalog.sqlite python3 tests/test_projection_art.py
          WEB_PROJECTION=out/web python3 tests/test_web_projection.py
          PROJECTION=out/publish/ear-drama.sqlite python3 tests/test_stations.py
          PROJECTION=out/publish/ear-drama.sqlite python3 tests/test_forwarding.py
          PROJECTION=out/publish-clean/ear-drama.sqlite python3 tests/test_forwarding.py

      - name: Restore the measured evenings (radiologs-latest)
        id: radiologs
        run: |
          # This workflow writes it (publish job). No Release or no asset means the
          # window is measured from scratch, capped; a cache that exists and cannot
          # be fetched is an error (never swallow a restore).
          mkdir -p catalog/.cache/radiologs live
          if out=$(gh release view radiologs-latest -R "$REPO" --json assets --jq '[.assets[].name] | join(" ")' 2>&1); then
            case " $out " in
              *" radiologs.tar.xz "*)
                bash tools/gh_retry.sh gh release download radiologs-latest -R "$REPO" -D live --clobber -p radiologs.tar.xz
                tar -xJf live/radiologs.tar.xz -C catalog/.cache ;;
              *) echo "::warning::radiologs-latest has no radiologs.tar.xz (assets: $out); measuring the window from scratch" ;;
            esac
          elif printf '%s' "$out" | grep -q "release not found"; then
            echo "::notice::no radiologs-latest Release yet: measuring the window from scratch"
          else
            echo "::error::could not read radiologs-latest: $out"
            exit 1
          fi
          n=0; [ -s catalog/.cache/radiologs/evenings.jsonl ] && n=$(wc -l < catalog/.cache/radiologs/evenings.jsonl)
          echo "measured evenings restored: $n"

      - name: Tonight in 19xx (the window's logs, politely; tonight.json)
        working-directory: catalog
        env:
          EARDRAMA_PROJECTION: out/publish/ear-drama.sqlite
          EARDRAMA_REGISTRY: out/radio-catalog.sqlite
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils > /dev/null
          # Only the window's anniversaries not yet measured, nearest day first, 3 s
          # apart; a day that enters the window costs about 21 PDFs (~1.3 MB).
          python3 tools/build_evenings.py measure --window --max-fetch 120 | tail -4
          mkdir -p out/live
          if out=$(gh release view catalog-latest -R "$REPO" --json assets --jq '[.assets[].name] | join(" ")' 2>&1); then
            case " $out " in
              *" tonight.json "*) bash ../tools/gh_retry.sh gh release download catalog-latest -R "$REPO" -D out/live --clobber -p tonight.json ;;
              *) echo "no tonight.json published yet: every day is new" ;;
            esac
          elif ! printf '%s' "$out" | grep -q "release not found"; then
            echo "::error::could not read catalog-latest: $out"
            exit 1
          fi
          if python3 tools/build_evenings.py tonight --previous out/live/tonight.json --out out/publish/tonight.json; then
            python3 tools/build_evenings.py web --src out/publish/tonight.json --web out/web --out out/web/tonight.json
            python3 tools/build_evenings.py kept --old out/live/tonight.json --new out/publish/tonight.json
          else
            echo "::warning::no evening could be published for the window; tonight.json is left as it is"
            rm -f out/publish/tonight.json out/web/tonight.json
          fi
          files=(radiologs/evenings.jsonl)
          [ -s .cache/radiologs/log-urls.json ] && files+=(radiologs/log-urls.json)
          if [ -s .cache/radiologs/evenings.jsonl ]; then
            tar -cJf out/radiologs.tar.xz -C .cache "${files[@]}"
            echo "measured evenings kept: $(wc -l < .cache/radiologs/evenings.jsonl)"
          fi

      - name: Genre stations on the one clock (stations.json)
        working-directory: catalog
        env:
          EARDRAMA_PROJECTION: out/publish/ear-drama.sqlite
        run: |
          set -euo pipefail
          # Contract §8: every published slot is kept as it is and the window is
          # extended four days past this build; a guard breach fails the build.
          mkdir -p out/live
          if out=$(gh release view catalog-latest -R "$REPO" --json assets --jq '[.assets[].name] | join(" ")' 2>&1); then
            case " $out " in
              *" stations.json "*) bash ../tools/gh_retry.sh gh release download catalog-latest -R "$REPO" -D out/live --clobber -p stations.json ;;
              *) echo "no stations.json published yet: a first schedule" ;;
            esac
          elif ! printf '%s' "$out" | grep -q "release not found"; then
            echo "::error::could not read catalog-latest: $out"
            exit 1
          fi
          python3 tools/build_stations.py build --previous out/live/stations.json --out out/publish/stations.json
          python3 tools/build_stations.py kept --old out/live/stations.json --new out/publish/stations.json
          python3 tools/build_stations.py web --src out/publish/stations.json --web out/web --out out/web/stations.json

      - name: What this publish changes (against what is live; read-only)
        run: |
          # live/ is what the forwarding was computed against (the fetch above). An id that
          # left with neither an alias nor a tombstone refuses the publish (contract §3.5).
          python3 catalog/tools/publish_diff.py --label "Served catalog" \
            --old-manifest live/manifest.json --new-manifest catalog/out/publish/manifest.json \
            --old-db live/ear-drama.sqlite.zz --new-db catalog/out/publish/ear-drama.sqlite \
            --old-research catalog/out/restored.sqlite --research catalog/out/radio-catalog.sqlite \
            --research-floor "$RESEARCH_FLOOR" --reason "$SHRINK_REASON" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the publishable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catalog-publish
          path: |
            catalog/out/publish/ear-drama.sqlite.zz
            catalog/out/publish/manifest.json
            catalog/out/publish/tonight.json
            catalog/out/publish/stations.json
            catalog/out/radiologs.tar.xz
            catalog/out/web/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The ONLY job holding the catalog writers' lock. GitHub keeps one pending
    # job per group (a newer arrival destroys the older pending one), so the
    # hold stays short: no build happens under it (docs/CI-FLEET.md section 1).
    concurrency:
      group: catalog-writers
      cancel-in-progress: false
    permissions:
      contents: write             # the catalog-latest Release
      pages: write                # deploy-pages
      id-token: write             # deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: catalog-publish
          path: built

      - name: Fetch what is published now (fresh, under the lock)
        id: live
        run: |
          mkdir -p live
          if out=$(gh release view catalog-latest -R "$REPO" --json assets --jq '[.assets[].name] | join(" ")' 2>&1); then
            echo "release=yes" >> "$GITHUB_OUTPUT"
            case " $out " in
              *" manifest.json "*)
                bash tools/gh_retry.sh gh release download catalog-latest -R "$REPO" -D live --clobber -p manifest.json ;;
              *)
                # Only a NON-EXISTENT release is a first run. One that exists
                # without its manifest is an emergency, not a fresh start.
                if [ -z "$SHRINK_REASON" ]; then
                  echo "::error::catalog-latest exists but has no manifest.json (assets: $out); dispatch with a shrink_reason to republish over it"
                  exit 1
                fi
                echo "::warning::catalog-latest has no manifest.json; publishing over it for the recorded reason: $SHRINK_REASON" ;;
            esac
          elif printf '%s' "$out" | grep -q "release not found"; then
            echo "release=no" >> "$GITHUB_OUTPUT"
            echo "no catalog-latest Release yet: first publish"
          else
            echo "::error::could not read catalog-latest: $out"
            exit 1
          fi
          site=$(cat CNAME)
          code=$(curl -sS -o live/web-manifest.json -w '%{http_code}' "https://$site/data/manifest.json")
          case "$code" in
            200) echo "live web projection: $(python3 -c "import json;m=json.load(open('live/web-manifest.json'));print(m['generatedAt'], m['counts']['episodes'])")" ;;
            404) rm -f live/web-manifest.json; echo "no web projection live yet: first publish" ;;
            *) echo "::error::https://$site/data/manifest.json answered $code"; exit 1 ;;
          esac

      - name: Refuse a shrunken publish (the merge guard)
        run: |
          python3 catalog/tools/publish_diff.py --label "Served catalog" \
            --old-manifest live/manifest.json --new-manifest built/publish/manifest.json \
            --max-shrink "$MAX_SHRINK" --reason "$SHRINK_REASON" --summary "$GITHUB_STEP_SUMMARY"
          python3 catalog/tools/publish_diff.py --label "Web projection" \
            --old-manifest live/web-manifest.json --new-manifest built/web/manifest.json \
            --max-shrink "$MAX_SHRINK" --reason "$SHRINK_REASON" --summary "$GITHUB_STEP_SUMMARY"

      - name: The forwarding was computed against what is live now (contract §3.5)
        run: |
          # A publish that landed between this run's build and this lock retired ids this
          # build never saw; uploading over it would leave them unforwarded.
          python3 catalog/tools/forwarding.py check-base --live live/manifest.json --built built/publish/manifest.json

      - name: A published evening never changes (contract §8)
        if: hashFiles('built/publish/tonight.json') != ''
        run: |
          # Re-read under the lock: every day already in the live tonight.json keeps
          # its evening and slots; only a withdrawal (a withheld episode) may differ.
          if [ "${{ steps.live.outputs.release }}" = "yes" ] && \
             gh release view catalog-latest -R "$REPO" --json assets --jq '.assets[].name' | grep -qx tonight.json; then
            bash tools/gh_retry.sh gh release download catalog-latest -R "$REPO" -D live --clobber -p tonight.json
          fi
          python3 catalog/tools/build_evenings.py kept --old live/tonight.json --new built/publish/tonight.json

      - name: A published station slot never changes (contract §8)
        run: |
          # Re-read under the lock: every slot still running or ahead keeps its
          # time and episode; only a withdrawal (a withheld slot) may differ.
          if [ "${{ steps.live.outputs.release }}" = "yes" ] && \
             gh release view catalog-latest -R "$REPO" --json assets --jq '.assets[].name' | grep -qx stations.json; then
            bash tools/gh_retry.sh gh release download catalog-latest -R "$REPO" -D live --clobber -p stations.json
          fi
          python3 catalog/tools/build_stations.py kept --old live/stations.json --new built/publish/stations.json

      - name: Upload to the rolling Release catalog-latest
        run: |
          if [ "${{ steps.live.outputs.release }}" = "no" ]; then
            bash tools/gh_retry.sh gh release create catalog-latest -R "$REPO" --latest=false \
              --title "Catalog (rolling)" \
              --notes "The served catalog every Ear Drama app reads (docs/CATALOG-CONTRACT.md §2): ear-drama.sqlite.zz (raw DEFLATE) and manifest.json. Replaced by .github/workflows/catalog-publish.yml; the research database lives on the dated catalog-YYYY-MM-DD Releases."
          fi
          # --clobber deletes before it uploads, so the database goes first and
          # the manifest that vouches for it (sha256) goes last.
          bash tools/gh_retry.sh gh release upload catalog-latest -R "$REPO" --clobber built/publish/ear-drama.sqlite.zz
          # The web projection too, so site-deploy.yml can redeploy the site's
          # code on a push without rebuilding the catalog.
          tar -cJf built/publish/web.tar.xz -C built web
          bash tools/gh_retry.sh gh release upload catalog-latest -R "$REPO" --clobber built/publish/web.tar.xz
          assets=(ear-drama.sqlite.zz web.tar.xz manifest.json)
          if [ -s built/publish/tonight.json ]; then
            bash tools/gh_retry.sh gh release upload catalog-latest -R "$REPO" --clobber built/publish/tonight.json
            assets+=(tonight.json)
          fi
          bash tools/gh_retry.sh gh release upload catalog-latest -R "$REPO" --clobber built/publish/stations.json
          assets+=(stations.json)
          bash tools/gh_retry.sh gh release upload catalog-latest -R "$REPO" --clobber built/publish/manifest.json
          # Evidence, not a claim: the hosted sizes match what was built.
          for f in "${assets[@]}"; do
            want=$(stat -c %s "built/publish/$f")
            got=$(gh release view catalog-latest -R "$REPO" --json assets --jq ".assets[] | select(.name == \"$f\") | .size")
            if [ "$got" != "$want" ]; then
              echo "::error::catalog-latest/$f is ${got:-missing} bytes; built $want"
              exit 1
            fi
            echo "catalog-latest/$f: $got bytes"
          done
          # The yield line tools/audit_workflow_health.py judges a green run by.
          echo "[catalog-publish] published $(python3 -c "import json;m=json.load(open('built/publish/manifest.json'));print(m['counts']['episodes'], 'episodes,', m['bytes']['zz'], 'bytes')") to catalog-latest"

      - name: Keep the measured evenings (radiologs-latest)
        if: hashFiles('built/radiologs.tar.xz') != ''
        run: |
          # Never destroy work: the cache only grows, so a smaller one is refused.
          new=$(tar -xJOf built/radiologs.tar.xz radiologs/evenings.jsonl | wc -l)
          if gh release view radiologs-latest -R "$REPO" > /dev/null 2>&1; then
            old=0
            if gh release view radiologs-latest -R "$REPO" --json assets --jq '.assets[].name' | grep -qx radiologs.tar.xz; then
              mkdir -p live/radiologs
              bash tools/gh_retry.sh gh release download radiologs-latest -R "$REPO" -D live/radiologs --clobber -p radiologs.tar.xz
              old=$(tar -xJOf live/radiologs/radiologs.tar.xz radiologs/evenings.jsonl | wc -l)
            fi
            if [ "$new" -lt "$old" ]; then
              echo "::error::radiologs.tar.xz would shrink from $old to $new measured evenings; not uploading"
              exit 1
            fi
          else
            bash tools/gh_retry.sh gh release create radiologs-latest -R "$REPO" --latest=false \
              --title "Evening logs (rolling)" \
              --notes "Measured network evenings for Tonight in 19xx (docs/research/evenings.md): station, time, program as printed, and the matched episode, plus the newspaper log links. Facts only; the pages stay at JJ's Newspaper Radio Logs. Written by .github/workflows/catalog-publish.yml."
          fi
          bash tools/gh_retry.sh gh release upload radiologs-latest -R "$REPO" --clobber built/radiologs.tar.xz
          echo "radiologs-latest: $new measured evenings"

      - name: Is Pages served from Actions?
        id: pages
        run: |
          if bt=$(gh api "repos/$REPO/pages" --jq .build_type 2>&1); then :; else
            if printf '%s' "$bt" | grep -q "HTTP 404"; then bt=none; else
              echo "::error::could not read the Pages configuration: $bt"
              exit 1
            fi
          fi
          if [ "$bt" = "workflow" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Pages build_type is '$bt', not 'workflow': the web projection was built and tested but not deployed. Owner: Settings > Pages > Source > GitHub Actions."
          fi

      - name: Assemble the site with the web projection under /data/
        if: steps.pages.outputs.go == 'yes'
        run: bash tools/assemble_site.sh built/web _site

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.go == 'yes'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.go == 'yes'
        with:
          path: _site

      - id: deployment
        if: steps.pages.outputs.go == 'yes'
        uses: actions/deploy-pages@v4

      - name: The live site serves this run's web projection
        if: steps.pages.outputs.go == 'yes'
        run: |
          site=$(cat CNAME)
          want=$(python3 -c "import json;print(json.load(open('built/web/manifest.json'))['generatedAt'])")
          for i in 1 2 3 4 5 6; do
            got=$(curl -sS "https://$site/data/manifest.json?run=${{ github.run_id }}" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['generatedAt'])" 2>/dev/null || true)
            if [ "$got" = "$want" ]; then
              echo "[catalog-publish] published $(python3 -c "import json;print(json.load(open('built/web/manifest.json'))['counts']['episodes'])") web episodes; live data/manifest.json generatedAt $got"
              exit 0
            fi
            sleep $((i * 10))
          done
          echo "::warning::deployed, but https://$site/data/manifest.json still says '${got}' (want $want) after ~3.5 minutes; the CDN may lag"
